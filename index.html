<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SparkGallery Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c1119;
            --panel: rgba(18, 24, 38, 0.95);
            --accent: #48f0ff;
            --accent-soft: rgba(72, 240, 255, 0.2);
            --text: #eef6ff;
            --muted: #93a4c7;
            --border: rgba(72, 240, 255, 0.35);
            --chip: rgba(72, 240, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: 'Exo 2', sans-serif;
            background: radial-gradient(circle at top, #182233 0%, var(--bg) 40%, #070a12 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .app {
            width: 100%;
            max-width: 520px;
            background: var(--panel);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(14px);
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 0.04em;
        }

        header p {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .status-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            background: var(--chip);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            letter-spacing: 0.03em;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        input,
        select,
        button,
        textarea {
            font-family: inherit;
        }

        textarea {
            min-height: 88px;
            resize: vertical;
            background: rgba(7, 10, 18, 0.8);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.9rem;
        }

        .grid-two {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        select,
        input[type="number"] {
            background: rgba(7, 10, 18, 0.8);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            font-size: 0.9rem;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: var(--accent);
            color: #02040a;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
        }

        .btn.secondary {
            background: transparent;
            border-color: var(--border);
            color: var(--text);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .card {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #0a0f19;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }

        .card-footer {
            padding: 8px 10px;
            font-size: 0.7rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .card-footer a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.7rem;
        }

        .empty-state {
            text-align: center;
            padding: 16px;
            border: 1px dashed var(--border);
            border-radius: 12px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        footer {
            font-size: 0.7rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>Telegram Web Bot: Free Image Studio</h1>
        <p>Генеруйте добірку безкоштовних зображень для постів, сторіз та превʼю.</p>
    </header>

    <div class="status-row">
        <span class="chip">Безкоштовні джерела</span>
        <span class="chip">Миттєва галерея</span>
        <span class="chip">Працює у Telegram</span>
    </div>

    <div class="field">
        <label for="prompt">Опишіть, які зображення потрібні</label>
        <textarea id="prompt" placeholder="Наприклад: футуристичне місто вночі, неонові вивіски, дощ"></textarea>
    </div>

    <div class="grid-two">
        <div class="field">
            <label for="style">Стиль</label>
            <select id="style">
                <option value="cyberpunk">Кіберпанк</option>
                <option value="minimal">Мінімалізм</option>
                <option value="nature">Природа</option>
                <option value="fashion">Мода</option>
                <option value="business">Бізнес</option>
                <option value="abstract">Абстракція</option>
            </select>
        </div>
        <div class="field">
            <label for="count">Кількість</label>
            <input id="count" type="number" min="2" max="8" value="4">
        </div>
        <div class="field">
            <label for="ratio">Формат</label>
            <select id="ratio">
                <option value="portrait">Портрет 4:5</option>
                <option value="square">Квадрат 1:1</option>
                <option value="landscape">Горизонтальний 16:9</option>
            </select>
        </div>
        <div class="field">
            <label for="tone">Настрій</label>
            <select id="tone">
                <option value="vibrant">Яскравий</option>
                <option value="soft">Мʼякий</option>
                <option value="dramatic">Драматичний</option>
                <option value="warm">Теплий</option>
                <option value="cool">Холодний</option>
            </select>
        </div>
    </div>

    <div class="actions">
        <button class="btn" id="generateBtn">Згенерувати добірку</button>
        <button class="btn secondary" id="resetBtn">Очистити</button>
    </div>

    <section>
        <div id="gallery" class="gallery"></div>
        <div id="empty" class="empty-state">Поки що немає результатів. Додайте опис і натисніть «Згенерувати».</div>
    </section>

    <footer>
        <span>Джерело: безкоштовні стоки (Unsplash Source)</span>
        <span class="mono" id="sessionInfo"></span>
    </footer>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const promptEl = document.getElementById('prompt');
    const styleEl = document.getElementById('style');
    const countEl = document.getElementById('count');
    const ratioEl = document.getElementById('ratio');
    const toneEl = document.getElementById('tone');
    const gallery = document.getElementById('gallery');
    const empty = document.getElementById('empty');
    const sessionInfo = document.getElementById('sessionInfo');

    const ratioMap = {
        portrait: { w: 720, h: 900 },
        square: { w: 720, h: 720 },
        landscape: { w: 960, h: 540 }
    };

    function buildPrompt() {
        const base = promptEl.value.trim() || 'creative photography';
        return `${base}, ${styleEl.value}, ${toneEl.value}`;
    }

    function buildUrl(seed, query, ratio) {
        const size = ratioMap[ratio] || ratioMap.square;
        return `https://source.unsplash.com/${size.w}x${size.h}/?${encodeURIComponent(query)}&sig=${seed}`;
    }

    function renderGallery(urls, query) {
        gallery.innerHTML = '';
        urls.forEach((url, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${url}" alt="${query}">
                <div class="card-footer">
                    <span>#${index + 1}</span>
                    <a href="${url}" target="_blank" rel="noopener">Відкрити</a>
                </div>
            `;
            gallery.appendChild(card);
        });
        empty.style.display = urls.length ? 'none' : 'block';
    }

    function generateImages() {
        const count = Math.min(Math.max(parseInt(countEl.value, 10) || 4, 2), 8);
        countEl.value = count;
        const prompt = buildPrompt();
        const urls = Array.from({ length: count }, (_, idx) => buildUrl(Date.now() + idx, prompt, ratioEl.value));
        renderGallery(urls, prompt);
    }

    function resetForm() {
        promptEl.value = '';
        styleEl.value = 'cyberpunk';
        countEl.value = 4;
        ratioEl.value = 'portrait';
        toneEl.value = 'vibrant';
        renderGallery([], '');
    }

    document.getElementById('generateBtn').addEventListener('click', generateImages);
    document.getElementById('resetBtn').addEventListener('click', resetForm);

    sessionInfo.textContent = `Session: ${Math.random().toString(36).slice(2, 8)}`;
</script>
</body>
</html>
