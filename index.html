<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER PLAYER STABLE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff; --bg: #05080a; --panel: rgba(10, 16, 20, 0.95);
            --border: rgba(0, 242, 255, 0.4); --text: #cffafe;
        }
        body.theme-cyber { --neon: #00f2ff; --bg: #05080a; --border: #00f2ff66; }
        body.theme-winter { --neon: #a0e9ff; --bg: #0a141a; --border: #a0e9ff33; }
        body.theme-gothic { --neon: #ff0000; --bg: #0a0000; --border: #330000; }
        body.theme-steampunk { --neon: #ffaa00; --bg: #1a0f00; --border: #553300; }
        body.theme-biopunk { --neon: #39ff14; --bg: #040d04; --border: #1a4d00; }
        body.theme-retro { --neon: #ff00ff; --bg: #120024; --border: #ff00ff66; }
        body.theme-industrial { --neon: #999999; --bg: #111111; --border: #444444; }

        * { box-sizing: border-box; outline: none; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Rajdhani', sans-serif; height: 100vh;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            transition: 0.5s;
        }

        #matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.3; pointer-events: none; }

        .main-deck {
            position: relative; z-index: 10; width: 92vw; max-width: 440px;
            background: var(--panel); border: 2px solid var(--border);
            border-radius: 15px; padding: 20px; backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        .search-bar { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; border: 1px solid var(--border); }
        .search-bar input { flex: 1; background: transparent; border: none; color: var(--neon); font-family: 'Orbitron'; padding: 8px; font-size: 0.8rem; }
        .search-bar button { background: var(--neon); border: none; color: #000; padding: 0 15px; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; border-radius: 3px; }

        .display-container {
            width: 100%; height: 210px; background: #000; border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
        }

        #yt-wrapper, #local-video { width: 100%; height: 100%; display: none; object-fit: contain; }
        #cover-art { width: 100%; height: 100%; object-fit: cover; }

        .track-info { text-align: center; margin: 10px 0; font-family: 'Orbitron'; font-size: 0.75rem; color: var(--neon); height: 18px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        .skip-config { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; font-family: 'Orbitron'; font-size: 0.7rem; color: var(--neon); }
        .skip-config input { background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: var(--neon); width: 50px; text-align: center; font-family: 'Orbitron'; }

        .progress-block { width: 100%; margin: 5px 0 15px 0; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--neon); }
        .time-info { display: flex; justify-content: space-between; font-size: 0.6rem; font-family: 'Orbitron'; color: var(--neon); }

        .btn-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn { background: none; border: none; color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .btn svg { width: 30px; height: 30px; fill: currentColor; }
        .btn-val { font-size: 0.55rem; margin-top: 4px; font-family: 'Orbitron'; color: var(--neon); }
        
        .play-main { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--border); color: var(--neon); display: flex; justify-content: center; align-items: center; }

        .theme-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .theme-btn { font-size: 0.55rem; padding: 6px 2px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: var(--text); cursor: pointer; text-align: center; }

        .footer { display: flex; justify-content: center; gap: 20px; margin-top: 20px; font-size: 0.7rem; font-family: 'Orbitron'; color: var(--neon); }
        
        .results-dropdown {
            position: absolute; top: 60px; left: 20px; right: 20px; background: rgba(5,8,10,0.98);
            border: 1px solid var(--neon); max-height: 240px; overflow-y: auto;
            display: none; z-index: 100;
        }
        .results-dropdown.active { display: block; }
        .res-card { display: flex; gap: 10px; padding: 8px; border-bottom: 1px solid rgba(0,242,255,0.1); cursor: pointer; align-items: center; font-size: 0.7rem; }
    </style>
</head>
<body class="theme-cyber">

<canvas id="matrix-bg"></canvas>

<div class="main-deck" id="playerNode">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="НАЗВАНИЕ ВИДЕО...">
        <button onclick="поискВидео()">ПОИСК</button>
    </div>
    <div class="results-dropdown" id="resultsBox"></div>

    <div class="display-container">
        <div id="yt-wrapper"><div id="yt-placeholder"></div></div>
        <video id="local-video"></video>
        <img id="cover-art" src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500" alt="Cover">
    </div>

    <div id="trackTitle" class="track-info">ОЖИДАНИЕ ВИДЕО</div>

    <div class="skip-config">
        <span>ИНТЕРВАЛ ПЕРЕМОТКИ:</span>
        <input type="number" id="skipInp" value="10" min="1" max="60" onchange="изменитьШаг(this.value)">
        <span>СЕК.</span>
    </div>

    <div class="progress-block">
        <input type="range" id="progressBar" value="0" step="1" oninput="перемотать(this.value)">
        <div class="time-info">
            <span id="curTime">0:00</span>
            <span id="durTime">0:00</span>
        </div>
    </div>

    <div class="btn-row">
        <button class="btn" onclick="сдвиг(-1)">
            <svg viewBox="0 0 24 24" style="transform: scaleX(-1);"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            <span class="btn-val" id="skipLblBack">-10с</span>
        </button>

        <button class="btn" onclick="поворот()">
            <svg viewBox="0 0 24 24"><path d="M12 4V1l5 5-5 5V8c-3.31 0-6 2.69-6 6 0 1.01.25 1.97.7 2.8l-1.46 1.46C4.46 16.97 4 15.51 4 14c0-4.42 3.58-8 8-8z"/></svg>
            <span class="btn-val">УГОЛ</span>
        </button>

        <button class="btn play-main" onclick="стартСтоп()">
            <svg id="playIcon" viewBox="0 0 24 24" width="35" height="35"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="btn" onclick="экран()">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            <span class="btn-val">РАЗМЕР</span>
        </button>

        <button class="btn" onclick="сдвиг(1)">
            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            <span class="btn-val" id="skipLblFwd">+10с</span>
        </button>
    </div>

    <div class="theme-selector">
        <div class="theme-btn" onclick="тема('cyber')">КИБЕР</div>
        <div class="theme-btn" onclick="тема('winter')">ЗИМА</div>
        <div class="theme-btn" onclick="тема('gothic')">ГОТИКА</div>
        <div class="theme-btn" onclick="тема('steampunk')">ПАРОВОЗ</div>
        <div class="theme-btn" onclick="тема('biopunk')">БИОПАНК</div>
        <div class="theme-btn" onclick="тема('retro')">РЕТРО</div>
        <div class="theme-btn" onclick="тема('industrial')">ЗАВОД</div>
    </div>

    <div class="footer">
        <label for="fileInput" style="cursor:pointer">[ ФАЙЛ ]</label>
        <span onclick="location.reload()" style="cursor:pointer">[ СБРОС ]</span>
    </div>
    <input type="file" id="fileInput" accept="video/*,audio/*" style="display:none">
</div>

<audio id="local-audio"></audio>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    let плеер, ютубРежим = false, файлРежим = false, шаг = 10, градус = 0;
    const звук = document.getElementById('local-audio');
    const видео = document.getElementById('local-video');
    
    const поискУрл = "https://inv.tux.pizza/api/v1/search?q=";

    function изменитьШаг(v) {
        шаг = Math.min(60, Math.max(1, parseInt(v) || 10));
        document.getElementById('skipLblBack').innerText = `-${шаг}с`;
        document.getElementById('skipLblFwd').innerText = `+${шаг}с`;
    }

    function onYouTubeIframeAPIReady() {
        плеер = new YT.Player('yt-placeholder', {
            height: '100%', width: '100%',
            playerVars: { 'controls': 0, 'modestbranding': 1, 'playsinline': 1 },
            events: { 'onStateChange': обновитьКнопку }
        });
    }

    async function поискВидео() {
        const текст = document.getElementById('searchInput').value;
        if(!текст) return;
        const блок = document.getElementById('resultsBox');
        блок.innerHTML = '<div style="padding:15px; color:var(--neon)">ПОИСК В СЕТИ...</div>';
        блок.classList.add('active');
        
        try {
            const res = await fetch(поискУрл + encodeURIComponent(текст) + "&type=video");
            const data = await res.json();
            
            блок.innerHTML = '';
            if(!data || data.length === 0) {
                блок.innerHTML = '<div style="padding:15px">НИЧЕГО НЕ НАЙДЕНО.</div>';
                return;
            }

            data.slice(0, 10).forEach(item => {
                const card = document.createElement('div');
                card.className = 'res-card';
                const img = item.videoThumbnails ? item.videoThumbnails[0].url : `https://img.youtube.com/vi/${item.videoId}/default.jpg`;
                card.innerHTML = `<img src="${img}" width="50" height="35"> <div>${item.title}</div>`;
                
                card.onclick = () => {
                    стопВсе(); 
                    ютубРежим = true; 
                    блок.classList.remove('active');
                    document.getElementById('cover-art').style.display = 'none';
                    document.getElementById('yt-wrapper').style.display = 'block';
                    document.getElementById('trackTitle').innerText = item.title;
                    плеер.loadVideoById(item.videoId);
                };
                блок.appendChild(card);
            });
        } catch (e) { 
            блок.innerHTML = '<div style="padding:15px">ОШИБКА СЕРВЕРА.</div>';
        }
    }

    function стопВсе() {
        ютубРежим = файлРежим = false; градус = 0;
        try { плеер.stopVideo(); } catch(e){}
        звук.pause(); видео.pause();
        видео.style.display = 'none';
        document.getElementById('yt-wrapper').style.display = 'none';
        document.getElementById('cover-art').style.display = 'block';
        document.getElementById('yt-wrapper').style.transform = 'none';
        видео.style.transform = 'none';
    }

    function стартСтоп() {
        if(ютубРежим) {
            const s = плеер.getPlayerState();
            s === 1 ? плеер.pauseVideo() : плеер.playVideo();
        } else if(файлРежим) {
            видео.paused ? видео.play() : видео.pause();
        } else {
            звук.paused ? звук.play() : звук.pause();
        }
        setTimeout(обновитьКнопку, 100);
    }

    function обновитьКнопку() {
        const btn = document.getElementById('playIcon');
        let active = false;
        if(ютубРежим) active = (плеер.getPlayerState && плеер.getPlayerState() === 1);
        else if(файлРежим) active = !видео.paused;
        else active = !звук.paused;
        btn.innerHTML = active ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    }

    function сдвиг(dir) {
        const d = dir * шаг;
        if(ютубРежим) плеер.seekTo(плеер.getCurrentTime() + d);
        else if(файлРежим) видео.currentTime += d;
        else звук.currentTime += d;
    }

    function перемотать(v_val) {
        if(ютубРежим) плеер.seekTo(v_val);
        else if(файлРежим) видео.currentTime = v_val;
        else звук.currentTime = v_val;
    }

    function поворот() {
        градус = (градус + 90) % 360; 
        const t = ютубРежим ? document.getElementById('yt-wrapper') : видео;
        t.style.transform = `rotate(${градус}deg)`;
    }

    function экран() {
        const n = document.getElementById('playerNode');
        if (!tg.isExpanded) tg.expand();
        try {
            if (document.fullscreenElement) document.exitFullscreen();
            else n.requestFullscreen();
        } catch(e){}
    }

    setInterval(() => {
        let c = 0, d = 0;
        if(ютубРежим) { try { c = плеер.getCurrentTime(); d = плеер.getDuration(); } catch(e){} }
        else if(файлРежим) { c = видео.currentTime; d = видео.duration; }
        else { c = звук.currentTime; d = звук.duration; }
        
        if(d) {
            const b = document.getElementById('progressBar');
            b.max = Math.floor(d); b.value = Math.floor(c);
            document.getElementById('curTime').innerText = fmt(c);
            document.getElementById('durTime').innerText = fmt(d);
        }
    }, 500);

    function fmt(s) {
        let m = Math.floor(s/60), sc = Math.floor(s%60);
        return `${m}:${sc < 10 ? '0'+sc : sc}`;
    }

    document.getElementById('fileInput').onchange = (e) => {
        const f = e.target.files[0]; if(!f) return;
        стопВсе(); const u = URL.createObjectURL(f);
        document.getElementById('trackTitle').innerText = f.name;
        if(f.type.startsWith('video')) {
            файлРежим = true; document.getElementById('cover-art').style.display = 'none';
            видео.style.display = 'block'; видео.src = u; видео.play();
        } else { звук.src = u; звук.play(); }
    };

    function тема(t) { document.body.className = 'theme-' + t; }

    // Фон Матрица
    const can = document.getElementById('matrix-bg'), x = can.getContext('2d');
    let dr = [];
    function rs() { can.width = window.innerWidth; can.height = window.innerHeight; dr = Array(Math.floor(can.width / 20)).fill(1); }
    function draw() {
        x.fillStyle = "rgba(0,0,0,0.05)"; x.fillRect(0,0,can.width,can.height);
        x.fillStyle = getComputedStyle(document.body).getPropertyValue('--neon');
        dr.forEach((y, i) => {
            x.fillText(Math.random()>0.5?"0":"1", i*20, y*20);
            if(y*20 > can.height && Math.random()>0.975) dr[i]=0; dr[i]++;
        });
    }
    window.onresize = rs; rs(); setInterval(draw, 50);
    window.onclick = (e) => { if(!e.target.closest('.search-bar')) document.getElementById('resultsBox').classList.remove('active'); }
</script>
</body>
</html>
