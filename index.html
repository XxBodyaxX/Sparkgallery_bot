<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Галерея Pro Ultimate 2025</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f0f4f8; --card: #ffffff; --text: #333; --accent: #03a9f4;
            --grad: linear-gradient(135deg, #4fc3f7 0%, #03a9f4 100%);
            --header-text: #ffffff;
        }

        /* ТЕМЫ */
        body.winter { --bg: #e1f5fe; --accent: #0288d1; --grad: linear-gradient(135deg, #b3e5fc, #0288d1); }
        body.spring { --bg: #f1f8e9; --accent: #689f38; --grad: linear-gradient(135deg, #dcedc8, #689f38); }
        body.summer { --bg: #fffde7; --accent: #fbc02d; --grad: linear-gradient(135deg, #fff9c4, #fbc02d); }
        body.autumn { --bg: #fbe9e7; --accent: #e64a19; --grad: linear-gradient(135deg, #ffccbc, #e64a19); }
        body.cyberpunk { --bg: #0d0221; --card: #241734; --text: #00ff41; --accent: #ff00ff; --grad: linear-gradient(135deg, #ff00ff, #00ffff); }
        body.gothic { --bg: #000; --card: #1a1a1a; --text: #cfd8dc; --accent: #b71c1c; --grad: linear-gradient(135deg, #424242, #121212); }
        body.stained-glass { --bg: #121212; --accent: #ffeb3b; --grad: linear-gradient(45deg, #f44336, #9c27b0, #2196f3, #4caf50, #ffeb3b); }
        body.anime { --bg: #fce4ec; --accent: #ec407a; --grad: linear-gradient(135deg, #f8bbd0, #f06292); }
        body.matrix { --bg: #000; --accent: #00ff41; --grad: linear-gradient(180deg, #003b00, #000); --text: #00ff41; }
        body.cats { --bg: #efebe9; --accent: #795548; --grad: linear-gradient(135deg, #d7ccc8, #a1887f); }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); transition: 0.5s; padding-bottom: 90px; }

        /* КАРТОЧКА ПРОФИЛЯ */
        .profile-card { 
            margin: 15px; padding: 25px 15px; border-radius: 25px; 
            background: var(--grad); color: var(--header-text); 
            position: relative; overflow: hidden; text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }
        
        .profile-content { 
            position: relative; z-index: 5; 
            background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 20px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.2);
        }

        /* АНИМАЦИЯ ЭМОДЗИ */
        .emoji-particle { 
            position: absolute; top: -60px; 
            animation: fall linear infinite; 
            pointer-events: none; z-index: 1; 
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
        }
        @keyframes fall { 
            0% { transform: translateY(0) rotate(0deg); opacity: 0; } 
            15% { opacity: 1; } 85% { opacity: 1; } 
            100% { transform: translateY(500px) rotate(360deg); opacity: 0; } 
        }

        /* ГАЛЕРЕЯ */
        .posts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .post-card { background: var(--card); border-radius: 18px; overflow: hidden; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.08); color: var(--text); }
        .post-media { width: 100%; height: 160px; object-fit: cover; border-bottom: 1px solid rgba(0,0,0,0.05); }

        /* НАВИГАЦИЯ */
        .nav { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; padding: 14px 0; border-top: 1px solid rgba(0,0,0,0.1); z-index: 1000; }
        .nav-item { flex: 1; text-align: center; font-size: 11px; color: #888; }
        .nav-item.active { color: var(--accent); font-weight: bold; }

        .page { display: none; }
        .page.active { display: block; }
        
        /* КНОПКИ И ВВОД */
        .btn { width: 100%; padding: 14px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-weight: bold; font-size: 15px; cursor: pointer; }
        select, input, textarea { width: 100%; padding: 14px; margin: 10px 0; border-radius: 14px; border: 1px solid #ddd; background: var(--card); color: inherit; }
        .fab { position: fixed; right: 20px; bottom: 100px; width: 65px; height: 65px; background: var(--grad); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; border: none; box-shadow: 0 6px 25px rgba(0,0,0,0.4); z-index: 900; }
        
        /* Плеер */
        .music-player-container { margin-top: 15px; border-radius: 15px; overflow: hidden; }
        iframe { width: 100%; border: none; display: block; }
    </style>
</head>
<body class="winter">

    <div class="page active" id="profilePage">
        <div class="profile-card" id="headerBox">
            <div class="profile-content">
                <div id="userAvatar" style="width:75px; height:75px; background:rgba(255,255,255,0.2); border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:35px; border:2px solid #fff;">👤</div>
                <h2 id="userName" style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Загрузка...</h2>
                
                <div id="globalMusicPlayer" class="music-player-container"></div>
            </div>
        </div>
        
        <div style="padding: 0 25px;">
            <div style="font-size:14px; margin-bottom:10px; display:flex; justify-content:space-between;">
                <span>Хранилище</span>
                <span><span id="storageSize">0</span> / 500 МБ</span>
            </div>
            <div style="height:12px; background:rgba(0,0,0,0.1); border-radius:6px; overflow:hidden;">
                <div id="storageBar" style="width:0%; height:100%; background:var(--accent); transition:0.6s;"></div>
            </div>
        </div>
    </div>

    <div class="page" id="galleryPage">
        <div style="padding:15px 15px 0;">
            <select id="dateFilter" onchange="renderPosts()">
                <option value="all">📅 Все публикации</option>
                <option value="today">🕒 Только сегодня</option>
            </select>
        </div>
        <div class="posts-grid" id="postsGrid"></div>
        <button class="fab" onclick="document.getElementById('uploadModal').style.display='flex'">+</button>
    </div>

    <div class="page" id="settingsPage">
        <div style="padding:25px;">
            <h3>🎭 Атмосфера</h3>
            <select id="themePicker" onchange="setTheme(this.value)">
                <option value="winter">❄️ Зима</option>
                <option value="spring">🌱 Весна</option>
                <option value="summer">☀️ Лето</option>
                <option value="autumn">🍂 Осень</option>
                <option value="cyberpunk">🌃 Киберпанк</option>
                <option value="gothic">🦇 Готика</option>
                <option value="stained-glass">🎨 Витраж</option>
                <option value="anime">🌸 Аниме</option>
                <option value="matrix">📟 Матрица</option>
                <option value="cats">🐾 Коты</option>
            </select>

            <div id="adminPanel" style="display:none; margin-top:40px; border-top:1px solid #ddd; padding-top:25px;">
                <h4 style="color:var(--accent)">🔊 Админ-плеер (Для всех 24/7)</h4>
                <p style="font-size:12px; color:#666; margin: 10px 0;">Spotify, YT Music, SoundCloud, TikTok</p>
                <input type="text" id="adminMusicUrl" placeholder="Вставьте ссылку...">
                <button class="btn" onclick="broadcastMusic()">Запустить трансляцию</button>
            </div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="nav('profile', this)">👤<br>Профиль</div>
        <div class="nav-item" onclick="nav('gallery', this)">🖼️<br>Галерея</div>
        <div class="nav-item" onclick="nav('settings', this)">⚙️<br>Настройки</div>
    </div>

    <div id="uploadModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:2000; align-items:center; justify-content:center; padding:25px;">
        <div style="background:var(--card); color:var(--text); padding:30px; border-radius:30px; width:100%; max-width:400px;">
            <h3>Новый пост</h3>
            <input type="file" id="fileInput" accept="image/*,video/*">
            <textarea id="postDesc" placeholder="Описание..."></textarea>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:#888;" onclick="document.getElementById('uploadModal').style.display='none'">Отмена</button>
                <button class="btn" id="uploadBtn" onclick="handleUpload()">Выложить</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const ADMIN_ID = '6918933194';
        const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/ddjfgk8a0/upload';
        const UPLOAD_PRESET = 'Sparkgallery';

        let posts = JSON.parse(localStorage.getItem('posts_final') || '[]');
        let storageUsed = parseInt(localStorage.getItem('storage_final') || '0');

        const themesData = {
            winter: ['❄️', '☃️', '🧤'],
            spring: ['🌸', '🦋', '🌷'],
            summer: ['☀️', '🌊', '🍦'],
            autumn: ['🍂', '🍁', '🍄'],
            cyberpunk: ['⚡', '👾', '🤖'],
            gothic: ['🦇', '💀', '🕯️'],
            'stained-glass': ['💎', '✨', '🎨'],
            anime: ['🍥', '🎀', '🌸'],
            matrix: ['🔢', '📟', '💻'],
            cats: ['🐱', '🐾', '🧶']
        };

        function init() {
            tg.ready();
            tg.expand();
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('userName').textContent = user.first_name;
                if (user.id.toString() === ADMIN_ID) document.getElementById('adminPanel').style.display = 'block';
            }
            
            const savedTheme = localStorage.getItem('theme') || 'winter';
            setTheme(savedTheme);
            document.getElementById('themePicker').value = savedTheme;
            
            renderPosts();
            updateStorageUI();
            renderGlobalPlayer();
        }

        // --- ЛОГИКА ТЕМ И ЭМОДЗИ ---
        function setTheme(theme) {
            document.body.className = theme;
            localStorage.setItem('theme', theme);
            const container = document.getElementById('headerBox');
            container.querySelectorAll('.emoji-particle').forEach(p => p.remove());
            
            const emojis = themesData[theme];
            for (let i = 0; i < 15; i++) {
                const p = document.createElement('div');
                p.className = 'emoji-particle';
                p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                p.style.left = Math.random() * 100 + '%';
                p.style.fontSize = (Math.random() * 10 + 25) + 'px';
                p.style.animationDuration = (Math.random() * 3 + 4) + 's';
                p.style.animationDelay = '-' + (Math.random() * 10) + 's';
                container.appendChild(p);
            }
        }

        // --- ЛОГИКА ПЛЕЕРА ---
        function broadcastMusic() {
            const url = document.getElementById('adminMusicUrl').value.trim();
            if (!url) return;
            localStorage.setItem('global_track_v5', url);
            renderGlobalPlayer();
            tg.showAlert("Трансляция запущена для всех!");
        }

        function renderGlobalPlayer() {
            const url = localStorage.getItem('global_track_v5');
            const container = document.getElementById('globalMusicPlayer');
            container.innerHTML = '';
            if (!url) return;

            const box = document.createElement('div');
            if (url.includes('spotify.com')) {
                const embed = url.replace('spotify.com/', 'spotify.com/embed/');
                box.innerHTML = `<iframe src="${embed}" height="80" allow="encrypted-media"></iframe>`;
            } else if (url.includes('youtube.com') || url.includes('youtu.be')) {
                const id = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop();
                box.innerHTML = `<iframe height="140" src="https://www.youtube.com/embed/${id}"></iframe>`;
            } else if (url.includes('soundcloud.com')) {
                box.innerHTML = `<iframe height="100" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23ff5500&auto_play=false&hide_related=true"></iframe>`;
            } else {
                box.innerHTML = `<a href="${url}" target="_blank" class="btn" style="background:rgba(255,255,255,0.2)">▶️ Слушать музыку</a>`;
            }
            container.appendChild(box);
        }

        // --- ЛОГИКА ГАЛЕРЕИ ---
        async function handleUpload() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true; btn.textContent = '...';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            try {
                const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
                const data = await res.json();
                posts.unshift({
                    id: Date.now(),
                    url: data.secure_url,
                    type: file.type,
                    desc: document.getElementById('postDesc').value,
                    date: new Date().toLocaleDateString()
                });
                storageUsed += file.size;
                localStorage.setItem('posts_final', JSON.stringify(posts));
                localStorage.setItem('storage_final', storageUsed);
                renderPosts();
                updateStorageUI();
                document.getElementById('uploadModal').style.display='none';
            } catch (e) { tg.showAlert('Ошибка'); }
            finally { btn.disabled = false; btn.textContent = 'Выложить'; }
        }

        function renderPosts() {
            const filter = document.getElementById('dateFilter').value;
            const container = document.getElementById('postsGrid');
            const today = new Date().toLocaleDateString();
            const filtered = posts.filter(p => filter === 'all' || p.date === today);
            
            container.innerHTML = filtered.map(p => `
                <div class="post-card">
                    ${p.type.startsWith('image') ? `<img src="${p.url}" class="post-media">` : `<video src="${p.url}" class="post-media" controls></video>`}
                    <div style="padding:10px; font-size:12px;">
                        <b>${p.desc || ''}</b>
                        <div style="color:#888; margin-top:4px;">${p.date}</div>
                    </div>
                </div>
            `).join('');
        }

        function updateStorageUI() {
            const mb = (storageUsed / 1024 / 1024).toFixed(1);
            document.getElementById('storageSize').textContent = mb;
            document.getElementById('storageBar').style.width = Math.min((mb / 500) * 100, 100) + '%';
        }

        function nav(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id + 'Page').classList.add('active');
            el.classList.add('active');
        }

        init();
    </script>
</body>
</html>
