<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Галерея Pro Ultimate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f0f4f8; --card: #ffffff; --text: #333; --accent: #03a9f4;
            --grad: linear-gradient(135deg, #4fc3f7 0%, #03a9f4 100%);
            --header-text: #ffffff;
        }

        /* ТЕМЫ */
        body.winter { --bg: #e1f5fe; --accent: #0288d1; --grad: linear-gradient(135deg, #b3e5fc, #0288d1); }
        body.spring { --bg: #f1f8e9; --accent: #689f38; --grad: linear-gradient(135deg, #dcedc8, #689f38); }
        body.summer { --bg: #fffde7; --accent: #fbc02d; --grad: linear-gradient(135deg, #fff9c4, #fbc02d); }
        body.autumn { --bg: #fbe9e7; --accent: #e64a19; --grad: linear-gradient(135deg, #ffccbc, #e64a19); }
        body.cyberpunk { --bg: #0d0221; --card: #241734; --text: #00ff41; --accent: #ff00ff; --grad: linear-gradient(135deg, #ff00ff, #00ffff); }
        body.gothic { --bg: #000; --card: #1a1a1a; --text: #cfd8dc; --accent: #b71c1c; --grad: linear-gradient(135deg, #424242, #121212); }
        body.stained-glass { --bg: #121212; --accent: #ffeb3b; --grad: linear-gradient(45deg, #f44336, #9c27b0, #2196f3, #4caf50, #ffeb3b); }
        body.anime { --bg: #fce4ec; --accent: #ec407a; --grad: linear-gradient(135deg, #f8bbd0, #f06292); }
        body.matrix { --bg: #000; --accent: #00ff41; --grad: linear-gradient(180deg, #003b00, #000); --text: #00ff41; }
        body.cats { --bg: #efebe9; --accent: #795548; --grad: linear-gradient(135deg, #d7ccc8, #a1887f); }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); transition: 0.5s; padding-bottom: 90px; overflow-x: hidden; }

        /* КАРТОЧКА ПРОФИЛЯ */
        .profile-card { 
            margin: 15px; padding: 30px 15px; border-radius: 25px; 
            background: var(--grad); color: var(--header-text); 
            position: relative; overflow: hidden; text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }
        
        .profile-content { 
            position: relative; z-index: 5; 
            background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 20px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.2);
        }

        /* ЭМОДЗИ (падают везде в профиле) */
        .emoji-particle { 
            position: absolute; top: -60px; animation: fall linear infinite; pointer-events: none; z-index: 1; 
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
        }
        @keyframes fall { 
            0% { transform: translateY(0) rotate(0deg); opacity: 0; } 
            15% { opacity: 1; } 85% { opacity: 1; } 
            100% { transform: translateY(500px) rotate(360deg); opacity: 0; } 
        }

        /* ГАЛЕРЕЯ */
        .posts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .post-card { background: var(--card); border-radius: 18px; overflow: hidden; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.08); color: var(--text); }
        .post-media { width: 100%; height: 160px; object-fit: cover; }

        /* СКРЫТЫЙ ПЛЕЕР */
        #hiddenPlayerContainer { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }

        /* КНОПКА ЗВУКА */
        #muteToggle { position: fixed; left: 20px; bottom: 100px; width: 50px; height: 50px; background: rgba(0,0,0,0.6); color: white; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 1001; border: 2px solid white; cursor: pointer; }

        /* НАВИГАЦИЯ */
        .nav { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; padding: 14px 0; border-top: 1px solid rgba(0,0,0,0.1); z-index: 1000; }
        .nav-item { flex: 1; text-align: center; font-size: 11px; color: #888; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .page { display: none; } .page.active { display: block; }
        .btn { width: 100%; padding: 14px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-weight: bold; cursor: pointer; }
        input, textarea, select { width: 100%; padding: 14px; margin: 10px 0; border-radius: 14px; border: 1px solid #ddd; background: var(--card); color: inherit; }
        .fab { position: fixed; right: 20px; bottom: 100px; width: 65px; height: 65px; background: var(--grad); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; border: none; box-shadow: 0 6px 25px rgba(0,0,0,0.4); z-index: 900; }
    </style>
</head>
<body class="winter">

    <div id="hiddenPlayerContainer"></div>
    <div id="muteToggle" onclick="toggleMute()">🔇</div>

    <div class="page active" id="profilePage">
        <div class="profile-card" id="headerBox">
            <div class="profile-content">
                <div id="userAvatar" style="width:70px; height:70px; background:rgba(255,255,255,0.2); border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:30px; border:2px solid #fff;">👤</div>
                <h2 id="userName" style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Загрузка...</h2>
                <div id="musicStatus" style="font-size: 11px; margin-top: 8px; opacity: 0.8;">🔕 Музыка не играет</div>
            </div>
        </div>
        <div style="padding: 0 25px;">
            <div style="font-size:12px; margin-bottom:8px; display:flex; justify-content:space-between;">
                <span>Хранилище</span> <span id="storageSize">0</span> / 500 МБ
            </div>
            <div style="height:8px; background:rgba(0,0,0,0.1); border-radius:4px; overflow:hidden;"><div id="storageBar" style="width:0%; height:100%; background:var(--accent); transition:0.5s;"></div></div>
        </div>
    </div>

    <div class="page" id="galleryPage">
        <div style="padding:15px 15px 0;">
            <select id="dateFilter" onchange="renderPosts()">
                <option value="all">Все посты</option>
                <option value="today">За сегодня</option>
            </select>
        </div>
        <div class="posts-grid" id="postsGrid"></div>
        <button class="fab" onclick="document.getElementById('uploadModal').style.display='flex'">+</button>
    </div>

    <div class="page" id="settingsPage">
        <div style="padding:25px;">
            <h3>Атмосфера</h3>
            <select id="themePicker" onchange="setTheme(this.value)">
                <option value="winter">❄️ Зима</option>
                <option value="spring">🌱 Весна</option>
                <option value="summer">☀️ Лето</option>
                <option value="autumn">🍂 Осень</option>
                <option value="cyberpunk">🌃 Киберпанк</option>
                <option value="gothic">🦇 Готика</option>
                <option value="stained-glass">🎨 Витраж</option>
                <option value="anime">🌸 Аниме</option>
                <option value="matrix">📟 Матрица</option>
                <option value="cats">🐾 Коты</option>
            </select>

            <div id="adminPanel" style="display:none; margin-top:30px; border-top:1px solid #ddd; padding-top:20px;">
                <h4 style="color:var(--accent)">🔊 Управление фоновой музыкой</h4>
                <input type="text" id="adminMusicUrl" placeholder="Ссылка на YouTube/SoundCloud/Spotify">
                <button class="btn" onclick="broadcastMusic(true)">Включить поток для всех</button>
                <button class="btn" style="background:#ff5252; margin-top:5px;" onclick="broadcastMusic(false)">Выключить у всех</button>
            </div>
        </div>
    </div>

    <div id="uploadModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; align-items:center; justify-content:center; padding:20px;">
        <div style="background:var(--card); padding:25px; border-radius:25px; width:100%;">
            <h3>Выложить пост</h3>
            <input type="file" id="fileInput" accept="image/*,video/*">
            <textarea id="postDesc" placeholder="Описание..."></textarea>
            <button class="btn" id="uploadBtn" onclick="handleUpload()">Опубликовать</button>
            <button class="btn" style="background:#888; margin-top:5px;" onclick="document.getElementById('uploadModal').style.display='none'">Отмена</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="nav('profile', this)">👤 Профиль</div>
        <div class="nav-item" onclick="nav('gallery', this)">🖼️ Галерея</div>
        <div class="nav-item" onclick="nav('settings', this)">⚙️ Настройки</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const ADMIN_ID = '6918933194'; // ЗАМЕНИТЕ НА ВАШ ID
        const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/ddjfgk8a0/upload';
        const UPLOAD_PRESET = 'Sparkgallery';

        let posts = JSON.parse(localStorage.getItem('posts_v6') || '[]');
        let storageUsed = parseInt(localStorage.getItem('storage_v6') || '0');
        let isMuted = true;

        const themesData = {
            winter: ['❄️', '☃️', '🧤'], spring: ['🌸', '🦋', '🌷'], summer: ['☀️', '🌊', '🍦'], autumn: ['🍂', '🍁', '🍄'],
            cyberpunk: ['⚡', '👾', '🤖'], gothic: ['🦇', '💀', '🕯️'], 'stained-glass': ['💎', '✨', '🎨'],
            anime: ['🍥', '🎀', '🌸'], matrix: ['🔢', '📟', '💻'], cats: ['🐱', '🐾', '🧶']
        };

        function init() {
            tg.ready();
            tg.expand();
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('userName').textContent = user.first_name;
                if (user.id.toString() === ADMIN_ID) document.getElementById('adminPanel').style.display = 'block';
            }
            setTheme(localStorage.getItem('theme') || 'winter');
            updateStorageUI();
            renderPosts();
            checkGlobalMusic();
        }

        // --- МУЗЫКА 24/7 ---
        function broadcastMusic(state) {
            if (state) {
                const url = document.getElementById('adminMusicUrl').value.trim();
                if (!url) return tg.showAlert("Введите ссылку!");
                localStorage.setItem('global_music_url', url);
                tg.showAlert("Музыка включена для всех!");
            } else {
                localStorage.removeItem('global_music_url');
                tg.showAlert("Музыка выключена");
            }
            checkGlobalMusic();
        }

        function checkGlobalMusic() {
            const url = localStorage.getItem('global_music_url');
            const container = document.getElementById('hiddenPlayerContainer');
            const toggle = document.getElementById('muteToggle');
            const status = document.getElementById('musicStatus');

            if (url) {
                let embed = '';
                if (url.includes('youtube.com') || url.includes('youtu.be')) {
                    const id = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop();
                    embed = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=0" allow="autoplay"></iframe>`;
                } else if (url.includes('soundcloud.com')) {
                    embed = `<iframe src="https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&auto_play=true"></iframe>`;
                } else {
                    embed = `<audio src="${url}" autoplay loop></audio>`;
                }
                container.innerHTML = embed;
                toggle.style.display = 'flex';
                status.innerHTML = '🎶 Поток активен (нажмите 🔇)';
            } else {
                container.innerHTML = '';
                toggle.style.display = 'none';
                status.innerHTML = '🔕 Музыка не играет';
            }
        }

        function toggleMute() {
            const player = document.querySelector('#hiddenPlayerContainer iframe, #hiddenPlayerContainer audio');
            const toggle = document.getElementById('muteToggle');
            if (isMuted) {
                // Браузеры требуют взаимодействия для включения звука
                document.getElementById('hiddenPlayerContainer').style.opacity = '1';
                toggle.innerHTML = '🔊';
                toggle.style.background = 'var(--accent)';
                isMuted = false;
                tg.showAlert("Звук включен!");
            } else {
                checkGlobalMusic(); // Перезапуск для сброса
                toggle.innerHTML = '🔇';
                toggle.style.background = 'rgba(0,0,0,0.6)';
                isMuted = true;
            }
        }

        // --- ОСТАЛЬНАЯ ЛОГИКА ---
        function setTheme(theme) {
            document.body.className = theme;
            localStorage.setItem('theme', theme);
            const container = document.getElementById('headerBox');
            container.querySelectorAll('.emoji-particle').forEach(p => p.remove());
            const emojis = themesData[theme];
            for (let i = 0; i < 15; i++) {
                const p = document.createElement('div');
                p.className = 'emoji-particle';
                p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                p.style.left = Math.random() * 100 + '%';
                p.style.fontSize = '25px';
                p.style.animationDuration = (Math.random() * 3 + 4) + 's';
                p.style.animationDelay = '-' + (Math.random() * 5) + 's';
                container.appendChild(p);
            }
        }

        async function handleUpload() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true; btn.textContent = 'Загрузка...';
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            try {
                const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
                const data = await res.json();
                posts.unshift({ id: Date.now(), url: data.secure_url, type: file.type, desc: document.getElementById('postDesc').value, date: new Date().toLocaleDateString() });
                storageUsed += file.size;
                localStorage.setItem('posts_v6', JSON.stringify(posts));
                localStorage.setItem('storage_v6', storageUsed);
                renderPosts();
                updateStorageUI();
                document.getElementById('uploadModal').style.display = 'none';
            } catch (e) { tg.showAlert("Ошибка!"); }
            finally { btn.disabled = false; btn.textContent = 'Опубликовать'; }
        }

        function renderPosts() {
            const filter = document.getElementById('dateFilter').value;
            const container = document.getElementById('postsGrid');
            const today = new Date().toLocaleDateString();
            const filtered = posts.filter(p => filter === 'all' || p.date === today);
            container.innerHTML = filtered.map(p => `
                <div class="post-card">
                    ${p.type.startsWith('image') ? `<img src="${p.url}" class="post-media">` : `<video src="${p.url}" class="post-media" controls></video>`}
                    <div style="padding:10px; font-size:12px;"><b>${p.desc || ''}</b><br><span style="color:#888">${p.date}</span></div>
                </div>
            `).join('');
        }

        function updateStorageUI() {
            const mb = (storageUsed / 1024 / 1024).toFixed(1);
            document.getElementById('storageSize').textContent = mb;
            document.getElementById('storageBar').style.width = Math.min((mb / 500) * 100, 100) + '%';
        }

        function nav(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id + 'Page').classList.add('active');
            el.classList.add('active');
        }

        init();
    </script>
</body>
</html>
