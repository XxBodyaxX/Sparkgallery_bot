<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER PLAYER ULTRA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff; --bg: #05080a; --panel: rgba(10, 16, 20, 0.95);
            --border: rgba(0, 242, 255, 0.4); --text: #cffafe;
        }
        body.theme-cyber { --neon: #00f2ff; --bg: #05080a; --border: #00f2ff66; }
        body.theme-winter { --neon: #a0e9ff; --bg: #0a141a; --border: #a0e9ff33; }
        body.theme-gothic { --neon: #ff0000; --bg: #0a0000; --border: #330000; }
        body.theme-steampunk { --neon: #ffaa00; --bg: #1a0f00; --border: #553300; }
        body.theme-biopunk { --neon: #39ff14; --bg: #040d04; --border: #1a4d00; }
        body.theme-retro { --neon: #ff00ff; --bg: #120024; --border: #ff00ff66; }
        body.theme-industrial { --neon: #999999; --bg: #111111; --border: #444444; }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Rajdhani', sans-serif; height: 100vh;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            transition: 0.5s;
        }

        #matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.3; pointer-events: none; }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .main-deck {
            position: relative; z-index: 10; width: 92vw; max-width: 440px;
            background: var(--panel); border: 2px solid var(--border);
            border-radius: 15px; padding: 20px; backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
            transition: all 0.3s ease-in-out;
        }

        /* ЭМУЛЯЦИЯ ПОЛНОГО ЭКРАНА (ПРОСТО РАСШИРЕНИЕ) */
        .main-deck.fullscreen-mode {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            max-width: none; border-radius: 0; border: none; z-index: 9999;
            justify-content: center;
        }

        .search-bar { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; border: 1px solid var(--border); }
        .search-bar input { flex: 1; background: transparent; border: none; color: var(--neon); font-family: 'Orbitron'; padding: 8px; font-size: 0.8rem; }
        .search-bar button { background: var(--neon); border: none; color: #000; padding: 0 15px; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; border-radius: 3px; }

        .display-container {
            width: 100%; height: 210px; background: #000; border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
        }
        .fullscreen-mode .display-container { height: 45vh; } /* Увеличиваем видео при расширении */

        #yt-wrapper, #local-video { width: 100%; height: 100%; display: none; object-fit: contain; }
        #cover-art { width: 100%; height: 100%; object-fit: cover; }

        .track-info { text-align: center; margin: 10px 0; font-family: 'Orbitron'; font-size: 0.75rem; color: var(--neon); height: 18px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        .progress-block { width: 100%; margin: 5px 0 15px 0; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--neon); }
        .time-info { display: flex; justify-content: space-between; font-size: 0.6rem; font-family: 'Orbitron'; color: var(--neon); }

        .btn-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn { background: none; border: none; color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .btn svg { width: 30px; height: 30px; fill: currentColor; }
        .btn-val { font-size: 0.55rem; margin-top: 4px; font-family: 'Orbitron'; color: var(--neon); }
        .play-main { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--border); color: var(--neon); display: flex; justify-content: center; align-items: center; }

        /* ТЕМЫ — СТРОГО ПО ЦЕНТРУ СНИЗУ */
        .theme-section {
            margin-top: auto; /* Прижимает к низу */
            display: flex; flex-direction: column; align-items: center; /* Центрирует контент */
            padding-top: 15px; border-top: 1px solid var(--border);
        }
        .theme-label { font-size: 0.6rem; font-family: 'Orbitron'; color: var(--neon); margin-bottom: 10px; }
        .theme-selector { 
            display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; /* Центрирует кнопки */
            max-width: 320px;
        }
        .theme-btn { 
            font-size: 0.55rem; padding: 6px 10px; background: rgba(0,0,0,0.4); 
            border: 1px solid var(--border); color: var(--text); cursor: pointer; 
            border-radius: 4px; font-family: 'Orbitron';
        }

        .footer { display: flex; justify-content: center; gap: 20px; margin-top: 15px; font-size: 0.7rem; font-family: 'Orbitron'; color: var(--neon); }
        
        .results-dropdown {
            position: absolute; top: 60px; left: 20px; right: 20px; background: rgba(5,8,10,0.98);
            border: 1px solid var(--neon); max-height: 200px; overflow-y: auto; display: none; z-index: 100;
        }
        .results-dropdown.active { display: block; }
        .res-card { display: flex; gap: 10px; padding: 8px; border-bottom: 1px solid rgba(0,242,255,0.1); cursor: pointer; align-items: center; font-size: 0.7rem; }
    </style>
</head>
<body class="theme-cyber">

<canvas id="matrix-bg"></canvas>

<div class="main-deck" id="playerNode">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="ПОИСК ВИДЕО...">
        <button onclick="runSearch()">OK</button>
    </div>
    <div class="results-dropdown" id="resultsBox"></div>

    <div class="display-container">
        <div id="yt-wrapper" style="width:100%;height:100%"><div id="yt-placeholder"></div></div>
        <video id="local-video"></video>
        <img id="cover-art" src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500">
    </div>

    <div id="trackTitle" class="track-info">READY FOR ACTION</div>

    <div class="progress-block">
        <input type="range" id="progressBar" value="0" step="1" oninput="manualSeek(this.value)">
        <div class="time-info">
            <span id="curTime">0:00</span>
            <span id="durTime">0:00</span>
        </div>
    </div>

    <div class="btn-row">
        <button class="btn" onclick="seekTrack(-1)">
            <svg viewBox="0 0 24 24" style="transform: scaleX(-1);"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            <span class="btn-val">-10с</span>
        </button>

        <button class="btn" onclick="rotateVideo()">
            <svg viewBox="0 0 24 24"><path d="M12 4V1l5 5-5 5V8c-3.31 0-6 2.69-6 6 0 1.01.25 1.97.7 2.8l-1.46 1.46C4.46 16.97 4 15.51 4 14c0-4.42 3.58-8 8-8z"/></svg>
            <span class="btn-val">УГОЛ</span>
        </button>

        <button class="btn play-main" onclick="togglePlay()">
            <svg id="playIcon" viewBox="0 0 24 24" width="35" height="35"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="btn" onclick="toggleFS()">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            <span class="btn-val">РАЗМЕР</span>
        </button>

        <button class="btn" onclick="seekTrack(1)">
            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            <span class="btn-val">+10с</span>
        </button>
    </div>

    <div class="theme-section">
        <span class="theme-label">CHOOSE INTERFACE</span>
        <div class="theme-selector">
            <button class="theme-btn" onclick="setTheme('cyber')">CYBER</button>
            <button class="theme-btn" onclick="setTheme('winter')">WINTER</button>
            <button class="theme-btn" onclick="setTheme('gothic')">GOTHIC</button>
            <button class="theme-btn" onclick="setTheme('steampunk')">STEAM</button>
            <button class="theme-btn" onclick="setTheme('biopunk')">BIO</button>
            <button class="theme-btn" onclick="setTheme('retro')">RETRO</button>
            <button class="theme-btn" onclick="setTheme('industrial')">IND</button>
        </div>
    </div>

    <div class="footer">
        <label for="fileInput" style="cursor:pointer">[ ФАЙЛ ]</label>
        <span onclick="location.reload()" style="cursor:pointer">[ RESET ]</span>
    </div>
    <input type="file" id="fileInput" accept="video/*,audio/*" style="display:none">
</div>

<audio id="local-audio" style="display:none"></audio>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    let player, isYT = false, isFile = false, rotation = 0;
    const audio = document.getElementById('local-audio'), video = document.getElementById('local-video');
    const proxies = ["https://inv.tux.pizza", "https://inv.vern.cc", "https://yewtu.be"];
    let curProxy = 0;

    // ПСЕВДО-ПОЛНОЭКРАННЫЙ РЕЖИМ (ПРИБЛИЖЕНИЕ)
    function toggleFS() {
        const node = document.getElementById('playerNode');
        node.classList.toggle('fullscreen-mode');
        if (tg.isExpanded) {
            // Если уже расширено, ничего не делаем, иначе расширяем Telegram
        } else {
            tg.expand();
        }
    }

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-placeholder', {
            height: '100%', width: '100%',
            playerVars: { 'controls': 0, 'modestbranding': 1, 'playsinline': 1 },
            events: { 'onStateChange': updatePlayIcon }
        });
    }

    async function runSearch() {
        const q = document.getElementById('searchInput').value;
        if(!q) return;
        const box = document.getElementById('resultsBox');
        box.innerHTML = '<div style="padding:10px; color:var(--neon)">SCANNING...</div>';
        box.classList.add('active');
        
        try {
            const res = await fetch(`${proxies[curProxy]}/api/v1/search?q=${encodeURIComponent(q)}&type=video`);
            const data = await res.json();
            box.innerHTML = '';
            data.slice(0, 8).forEach(item => {
                const div = document.createElement('div');
                div.className = 'res-card';
                div.innerHTML = `<img src="${item.videoThumbnails[0].url}" width="40"> <span>${item.title}</span>`;
                div.onclick = () => {
                    resetMedia(); isYT = true;
                    document.getElementById('cover-art').style.display = 'none';
                    document.getElementById('yt-wrapper').style.display = 'block';
                    document.getElementById('trackTitle').innerText = item.title;
                    player.loadVideoById(item.videoId);
                    box.classList.remove('active');
                };
                box.appendChild(div);
            });
        } catch (e) {
            curProxy = (curProxy + 1) % proxies.length;
            runSearch();
        }
    }

    function resetMedia() {
        isYT = isFile = false; rotation = 0;
        try { player.stopVideo(); } catch(e){}
        audio.pause(); video.pause();
        video.style.display = 'none';
        document.getElementById('yt-wrapper').style.display = 'none';
        document.getElementById('cover-art').style.display = 'block';
    }

    function togglePlay() {
        if(isYT) {
            player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
        } else if(isFile) {
            video.paused ? video.play() : video.pause();
        } else {
            audio.paused ? audio.play() : audio.pause();
        }
        setTimeout(updatePlayIcon, 200);
    }

    function updatePlayIcon() {
        const icon = document.getElementById('playIcon');
        let playing = isYT ? (player.getPlayerState() === 1) : (isFile ? !video.paused : !audio.paused);
        icon.innerHTML = playing ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    }

    function seekTrack(dir) {
        let step = 10 * dir;
        if(isYT) player.seekTo(player.getCurrentTime() + step);
        else if(isFile) video.currentTime += step;
        else audio.currentTime += step;
    }

    function manualSeek(v) {
        if(isYT) player.seekTo(v);
        else if(isFile) video.currentTime = v;
        else audio.currentTime = v;
    }

    function rotateVideo() {
        rotation = (rotation + 90) % 360;
        const target = isYT ? document.getElementById('yt-wrapper') : video;
        target.style.transform = `rotate(${rotation}deg)`;
    }

    function setTheme(t) { document.body.className = 'theme-' + t; }

    setInterval(() => {
        let cur = 0, dur = 0;
        if(isYT) { try { cur = player.getCurrentTime(); dur = player.getDuration(); } catch(e){} }
        else if(isFile) { cur = video.currentTime; dur = video.duration; }
        else { cur = audio.currentTime; dur = audio.duration; }
        if(dur) {
            const bar = document.getElementById('progressBar');
            bar.max = Math.floor(dur); bar.value = Math.floor(cur);
            document.getElementById('curTime').innerText = fmt(cur);
            document.getElementById('durTime').innerText = fmt(dur);
        }
    }, 500);

    function fmt(s) {
        let m = Math.floor(s/60), sc = Math.floor(s%60);
        return `${m}:${sc < 10 ? '0'+sc : sc}`;
    }

    document.getElementById('fileInput').onchange = (e) => {
        const f = e.target.files[0]; if(!f) return;
        resetMedia(); const u = URL.createObjectURL(f);
        document.getElementById('trackTitle').innerText = f.name;
        if(f.type.startsWith('video')) {
            isFile = true; document.getElementById('cover-art').style.display = 'none';
            video.style.display = 'block'; video.src = u; video.play();
        } else { audio.src = u; audio.play(); }
    };

    // Matrix Background
    const can = document.getElementById('matrix-bg'), ctx = can.getContext('2d');
    let dr = [];
    function rs() { can.width = window.innerWidth; can.height = window.innerHeight; dr = Array(Math.floor(can.width / 20)).fill(1); }
    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,can.width,can.height);
        ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--neon');
        dr.forEach((y, i) => {
            ctx.fillText(Math.random()>0.5?"0":"1", i*20, y*20);
            if(y*20 > can.height && Math.random()>0.975) dr[i]=0; dr[i]++;
        });
    }
    window.onresize = rs; rs(); setInterval(draw, 50);
</script>
</body>
</html>
