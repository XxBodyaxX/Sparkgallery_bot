<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CYBER PLAYER STABLE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff; --bg: #05080a; --panel: rgba(10, 16, 20, 0.95);
            --border: rgba(0, 242, 255, 0.4); --text: #cffafe;
        }
        body.theme-cyber { --neon: #00f2ff; --bg: #05080a; --border: #00f2ff66; }
        body.theme-winter { --neon: #a0e9ff; --bg: #0a141a; --border: #a0e9ff33; }
        body.theme-gothic { --neon: #ff0000; --bg: #0a0000; --border: #330000; }
        body.theme-steampunk { --neon: #ffaa00; --bg: #1a0f00; --border: #553300; }
        body.theme-biopunk { --neon: #39ff14; --bg: #040d04; --border: #1a4d00; }
        body.theme-retro { --neon: #ff00ff; --bg: #120024; --border: #ff00ff66; }
        body.theme-industrial { --neon: #999999; --bg: #111111; --border: #444444; }

        * { box-sizing: border-box; outline: none; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Rajdhani', sans-serif; height: 100vh;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            transition: 0.5s;
        }

        #matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.4; pointer-events: none; }

        .main-deck {
            position: relative; z-index: 10; width: 92vw; max-width: 440px;
            background: var(--panel); border: 2px solid var(--border);
            border-radius: 15px; padding: 20px; backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        .search-bar { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; border: 1px solid var(--border); }
        .search-bar input { flex: 1; background: transparent; border: none; color: var(--neon); font-family: 'Orbitron'; padding: 8px; font-size: 0.8rem; }
        .search-bar button { background: var(--neon); border: none; color: #000; padding: 0 15px; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; border-radius: 3px; }

        .display-container {
            width: 100%; height: 210px; background: #000; border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
        }

        #yt-wrapper, #local-video { width: 100%; height: 100%; display: none; object-fit: contain; }
        #cover-art { width: 100%; height: 100%; object-fit: cover; }

        .track-info { text-align: center; margin: 10px 0; font-family: 'Orbitron'; font-size: 0.75rem; color: var(--neon); height: 18px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        .skip-config { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; font-family: 'Orbitron'; font-size: 0.7rem; color: var(--neon); }
        .skip-config input { background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: var(--neon); width: 50px; text-align: center; padding: 2px; }

        .progress-block { width: 100%; margin: 5px 0 15px 0; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--neon); }
        .time-info { display: flex; justify-content: space-between; font-size: 0.6rem; font-family: 'Orbitron'; color: var(--neon); }

        .btn-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn { background: none; border: none; color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .btn:active { transform: scale(0.9); }
        .btn svg { width: 28px; height: 28px; fill: currentColor; }
        .btn-val { font-size: 0.55rem; margin-top: 4px; font-family: 'Orbitron'; color: var(--neon); }
        
        .play-main { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--border); color: var(--neon); display: flex; justify-content: center; align-items: center; }

        .theme-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .theme-btn { font-size: 0.55rem; padding: 6px 2px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: var(--text); cursor: pointer; text-align: center; }

        .footer { display: flex; justify-content: center; gap: 20px; margin-top: 20px; font-size: 0.7rem; font-family: 'Orbitron'; }
        .footer label, .footer span { cursor: pointer; color: var(--neon); border-bottom: 1px solid transparent; }
        .footer label:hover { border-bottom: 1px solid var(--neon); }

        .results-dropdown {
            position: absolute; top: 60px; left: 20px; right: 20px; background: rgba(5,8,10,0.98);
            border: 1px solid var(--neon); max-height: 250px; overflow-y: auto;
            display: none; z-index: 100; box-shadow: 0 0 20px #000;
        }
        .results-dropdown.active { display: block; }
        .res-card { display: flex; gap: 10px; padding: 8px; border-bottom: 1px solid rgba(0,242,255,0.1); cursor: pointer; align-items: center; font-size: 0.7rem; }
        .res-card:hover { background: rgba(0,242,255,0.1); }
        .res-card img { border-radius: 4px; }
    </style>
</head>
<body class="theme-cyber">

<canvas id="matrix-bg"></canvas>

<div class="main-deck" id="playerNode">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="НАЗВАНИЕ ВИДЕО...">
        <button onclick="runSearch()">ПОИСК</button>
    </div>
    <div class="results-dropdown" id="resultsBox"></div>

    <div class="display-container">
        <div id="yt-wrapper" style="width:100%;height:100%"><div id="yt-placeholder"></div></div>
        <video id="local-video"></video>
        <img id="cover-art" src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500">
    </div>

    <div id="trackTitle" class="track-info">READY TO SCAN</div>

    <div class="skip-config">
        <span>ШАГ ПЕРЕМОТКИ:</span>
        <input type="number" id="skipInp" value="10" min="1" max="60" onchange="updateSkip(this.value)">
        <span>СЕК.</span>
    </div>

    <div class="progress-block">
        <input type="range" id="progressBar" value="0" step="1" oninput="manualSeek(this.value)">
        <div class="time-info">
            <span id="curTime">0:00</span>
            <span id="durTime">0:00</span>
        </div>
    </div>

    <div class="btn-row">
        <button class="btn" onclick="seekTrack(-1)">
            <svg viewBox="0 0 24 24" style="transform: scaleX(-1);"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            <span class="btn-val" id="skipLblBack">-10s</span>
        </button>

        <button class="btn" onclick="rotateVideo()">
            <svg viewBox="0 0 24 24"><path d="M12 4V1l5 5-5 5V8c-3.31 0-6 2.69-6 6 0 1.01.25 1.97.7 2.8l-1.46 1.46C4.46 16.97 4 15.51 4 14c0-4.42 3.58-8 8-8z"/></svg>
            <span class="btn-val">ROT</span>
        </button>

        <button class="btn play-main" onclick="togglePlay()">
            <svg id="playIcon" viewBox="0 0 24 24" width="30" height="30"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="btn" onclick="toggleFull()">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            <span class="btn-val">WIDE</span>
        </button>

        <button class="btn" onclick="seekTrack(1)">
            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            <span class="btn-val" id="skipLblFwd">+10s</span>
        </button>
    </div>

    <div class="theme-selector">
        <div class="theme-btn" onclick="setTheme('cyber')">КИБЕР</div>
        <div class="theme-btn" onclick="setTheme('winter')">ЗИМА</div>
        <div class="theme-btn" onclick="setTheme('gothic')">ГОТИКА</div>
        <div class="theme-btn" onclick="setTheme('steampunk')">ПАРОВОЗ</div>
        <div class="theme-btn" onclick="setTheme('biopunk')">БИОПАНК</div>
        <div class="theme-btn" onclick="setTheme('retro')">РЕТРО</div>
        <div class="theme-btn" onclick="setTheme('industrial')">ЗАВОД</div>
    </div>

    <div class="footer">
        <label for="fileInput">[ FILE ]</label>
        <span onclick="location.reload()">[ RESET ]</span>
    </div>
    <input type="file" id="fileInput" accept="video/*,audio/*" style="display:none">
</div>

<audio id="local-audio"></audio>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    let player, isYT = false, isVideoFile = false, skipTime = 10, rot = 0;
    const a = document.getElementById('local-audio'), v = document.getElementById('local-video');
    
    // Используем рабочий API Invidious
    const searchAPIs = [
        "https://invidious.lunar.icu/api/v1/search?q=",
        "https://inv.tux.pizza/api/v1/search?q="
    ];
    let currentApiIdx = 0;

    function updateSkip(val) {
        skipTime = Math.min(60, Math.max(1, parseInt(val) || 10));
        document.getElementById('skipLblBack').innerText = `-${skipTime}s`;
        document.getElementById('skipLblFwd').innerText = `+${skipTime}s`;
        document.getElementById('skipInp').value = skipTime;
    }

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-placeholder', {
            height: '100%', width: '100%',
            playerVars: { 'controls': 0, 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
            events: { 'onStateChange': () => updatePlayIcon() }
        });
    }

    async function runSearch() {
        const q = document.getElementById('searchInput').value;
        if(!q) return;
        const box = document.getElementById('resultsBox');
        box.innerHTML = '<div style="padding:15px; color:var(--neon)">SCANNING NETWORK...</div>';
        box.classList.add('active');
        
        try {
            const res = await fetch(searchAPIs[currentApiIdx] + encodeURIComponent(q));
            const data = await res.json();
            
            box.innerHTML = '';
            if(!data || data.length === 0) throw new Error();

            data.slice(0, 15).forEach(item => {
                if(item.type !== 'video') return;
                
                const div = document.createElement('div');
                div.className = 'res-card';
                const thumb = item.videoThumbnails ? item.videoThumbnails[0].url : `https://img.youtube.com/vi/${item.videoId}/default.jpg`;
                div.innerHTML = `<img src="${thumb}" width="60" height="45"> <div>${item.title}</div>`;
                
                div.onclick = () => {
                    resetMedia(); 
                    isYT = true; 
                    box.classList.remove('active');
                    document.getElementById('cover-art').style.display = 'none';
                    document.getElementById('yt-wrapper').style.display = 'block';
                    document.getElementById('trackTitle').innerText = item.title;
                    player.loadVideoById(item.videoId);
                };
                box.appendChild(div);
            });
        } catch (e) { 
            currentApiIdx = (currentApiIdx + 1) % searchAPIs.length;
            box.innerHTML = '<div style="padding:15px">SERVER BUSY. RETRYING...</div>';
            setTimeout(runSearch, 1000);
        }
    }

    function resetMedia() {
        isYT = false; isVideoFile = false; rot = 0;
        try { player.stopVideo(); } catch(e){}
        a.pause(); v.pause();
        v.style.display = 'none';
        document.getElementById('yt-wrapper').style.display = 'none';
        document.getElementById('cover-art').style.display = 'block';
        v.style.transform = 'none';
        document.getElementById('yt-wrapper').style.transform = 'none';
    }

    function togglePlay() {
        if(isYT) {
            const state = player.getPlayerState();
            state === 1 ? player.pauseVideo() : player.playVideo();
        } else if(isVideoFile) {
            v.paused ? v.play() : v.pause();
        } else {
            a.paused ? a.play() : a.pause();
        }
        updatePlayIcon();
    }

    function updatePlayIcon() {
        const icon = document.getElementById('playIcon');
        let playing = false;
        if(isYT) playing = (player.getPlayerState && player.getPlayerState() === 1);
        else if(isVideoFile) playing = !v.paused;
        else playing = !a.paused;
        
        icon.innerHTML = playing ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    }

    function seekTrack(dir) {
        const delta = dir * skipTime;
        if(isYT) player.seekTo(player.getCurrentTime() + delta);
        else if(isVideoFile) v.currentTime += delta;
        else a.currentTime += delta;
    }

    function manualSeek(val) {
        if(isYT) player.seekTo(val);
        else if(isVideoFile) v.currentTime = val;
        else a.currentTime = val;
    }

    function rotateVideo() {
        rot = (rot + 90) % 360; 
        const target = isYT ? document.getElementById('yt-wrapper') : v;
        target.style.transform = `rotate(${rot}deg)`;
        target.style.transition = '0.3s';
    }

    function toggleFull() {
        if (!tg.isExpanded) tg.expand();
        const p = document.getElementById('playerNode');
        if (document.fullscreenElement) document.exitFullscreen();
        else p.requestFullscreen().catch(() => {});
    }

    setInterval(() => {
        let cur = 0, dur = 0;
        if(isYT) { 
            try { cur = player.getCurrentTime(); dur = player.getDuration(); } catch(e){} 
        } else if(isVideoFile) { 
            cur = v.currentTime; dur = v.duration; 
        } else if(a.src) { 
            cur = a.currentTime; dur = a.duration; 
        }
        
        if(dur && !isNaN(dur)) {
            const bar = document.getElementById('progressBar');
            bar.max = Math.floor(dur);
            bar.value = Math.floor(cur);
            document.getElementById('curTime').innerText = formatTime(cur);
            document.getElementById('durTime').innerText = formatTime(dur);
        }
    }, 500);

    function formatTime(s) {
        let m = Math.floor(s/60), sc = Math.floor(s%60);
        return `${m}:${sc < 10 ? '0'+sc : sc}`;
    }

    document.getElementById('fileInput').onchange = function(e) {
        const file = e.target.files[0];
        if(!file) return;
        resetMedia();
        const url = URL.createObjectURL(file);
        document.getElementById('trackTitle').innerText = file.name;
        if(file.type.startsWith('video')) {
            isVideoFile = true;
            document.getElementById('cover-art').style.display = 'none';
            v.style.display = 'block'; v.src = url; v.play();
        } else {
            a.src = url; a.play();
        }
    };

    function setTheme(t) { document.body.className = 'theme-' + t; }

    // Matrix Background Logic
    const canvas = document.getElementById('matrix-bg'), ctx = canvas.getContext('2d');
    let drops = [];
    function initM() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        drops = Array(Math.floor(canvas.width / 20)).fill(1);
    }
    const themeAssets = {
        cyber:["0","1"], winter:["*","+"], gothic:["†","v"], steampunk:["8","9"], biopunk:["o","x"], retro:["#","="], industrial:["-","!"]
    };
    function drawM() {
        const theme = document.body.className.replace('theme-', '');
        const assets = themeAssets[theme] || themeAssets.cyber;
        ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--neon');
        ctx.font = "14px monospace";
        drops.forEach((y, i) => {
            const char = assets[Math.floor(Math.random()*assets.length)];
            ctx.fillText(char, i * 20, y * 20);
            if (y * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    window.onresize = initM; initM(); setInterval(drawM, 50);
    window.onclick = (e) => { if(!e.target.closest('.search-bar')) document.getElementById('resultsBox').classList.remove('active'); }
</script>
</body>
</html>
