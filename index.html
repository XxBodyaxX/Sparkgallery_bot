<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER PLAYER WEB APP</title>
    <script src="https://tgram.github.io/webapp-apps/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #05080a);
            --tg-btn: var(--tg-theme-button-color, #00f2ff);
            --tg-btn-text: var(--tg-theme-button-text-color, #000);
            --neon: #00f2ff; 
            --bg: var(--tg-bg); 
            --panel: rgba(10, 16, 20, 0.9);
            --border: rgba(0, 242, 255, 0.4); 
            --text: var(--tg-theme-text-color, #cffafe);
        }

        body.theme-cyber { --neon: #00f2ff; }
        body.theme-winter { --neon: #a0e9ff; }
        body.theme-gothic { --neon: #ff0000; }
        body.theme-retro { --neon: #ff00ff; }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Rajdhani', sans-serif; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; transition: 0.5s;
        }

        #matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.3; pointer-events: none; }

        .main-deck {
            position: relative; z-index: 10; width: 95%; max-width: 440px;
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 20px; padding: 20px; backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .search-bar { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.4); padding: 5px; border-radius: 10px; border: 1px solid var(--border); }
        .search-bar input { flex: 1; background: transparent; border: none; color: var(--neon); font-family: 'Orbitron'; padding: 10px; font-size: 0.9rem; }
        .search-bar button { background: var(--tg-btn); border: none; color: var(--tg-btn-text); padding: 0 15px; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; border-radius: 8px; }

        .results-dropdown {
            position: absolute; top: 70px; left: 20px; right: 20px; background: #000;
            border: 1px solid var(--neon); max-height: 250px; overflow-y: auto;
            display: none; z-index: 100; border-radius: 10px;
        }
        .results-dropdown.active { display: block; }
        .res-card { display: flex; gap: 10px; padding: 10px; border-bottom: 1px solid #222; cursor: pointer; align-items: center; font-size: 0.8rem; }

        .display-container {
            width: 100%; height: 200px; background: #000; border: 1px solid var(--border);
            border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
        }
        #yt-wrapper, #local-video { width: 100%; height: 100%; transition: transform 0.4s ease; display: none; object-fit: contain; }
        #yt-placeholder { width: 100%; height: 100%; }
        #cover-art { width: 100%; height: 100%; object-fit: cover; }

        .track-info { text-align: center; margin: 10px 0; font-family: 'Orbitron'; font-size: 0.75rem; color: var(--neon); height: 18px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        .progress-block { width: 100%; margin-bottom: 10px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--neon); }
        .time-info { display: flex; justify-content: space-between; font-size: 0.65rem; font-family: 'Orbitron'; color: var(--neon); opacity: 0.8; }

        .btn-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        .btn { background: none; border: none; color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: 0.2s; }
        .btn:active { transform: scale(0.9); }
        .btn svg { width: 32px; height: 32px; fill: currentColor; }
        .btn-val { font-size: 0.55rem; margin-top: 4px; font-family: 'Orbitron'; color: var(--neon); }
        
        .play-main { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--border); color: var(--neon); display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px var(--border); }

        .theme-selector { margin-top: 15px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .theme-btn { font-size: 0.5rem; padding: 8px 2px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); cursor: pointer; text-align: center; border-radius: 5px; }

        .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .file-lbl { cursor: pointer; color: var(--neon); font-size: 0.7rem; font-weight: bold; border: 1px dashed var(--neon); padding: 5px 10px; border-radius: 5px; }
        .close-btn { color: #ff4444; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; font-family: 'Orbitron'; }
    </style>
</head>
<body class="theme-cyber">

<canvas id="matrix-bg"></canvas>

<div class="main-deck">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="ПОИСК...">
        <button onclick="runSearch()">📡</button>
    </div>
    <div class="results-dropdown" id="resultsBox"></div>

    <div class="display-container">
        <div id="yt-wrapper"><div id="yt-placeholder"></div></div>
        <video id="local-video" playsinline preload="metadata"></video>
        <img id="cover-art" src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?w=500">
    </div>

    <div id="trackTitle" class="track-info">СИСТЕМА ГОТОВА</div>

    <div class="progress-block">
        <input type="range" id="progressBar" value="0" min="0">
        <div class="time-info">
            <span id="curTime">0:00</span>
            <span id="durTime">0:00</span>
        </div>
    </div>

    <div class="btn-row">
        <button class="btn" onclick="seekTrack(-1)">
            <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z" transform="rotate(180 12 12)"/></svg>
            <span class="btn-val">-10s</span>
        </button>

        <button class="btn" onclick="rotateVideo()">
            <svg viewBox="0 0 24 24"><path d="M12 4V1l5 5-5 5V8c-3.31 0-6 2.69-6 6 0 1.01.25 1.97.7 2.8l-1.46 1.46C4.46 16.97 4 15.51 4 14c0-4.42 3.58-8 8-8z"/></svg>
            <span class="btn-val">ROTATE</span>
        </button>

        <button class="btn play-main" onclick="togglePlay()">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="btn" onclick="seekTrack(1)">
            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            <span class="btn-val">+10s</span>
        </button>
    </div>

    <div class="theme-selector">
        <div class="theme-btn" onclick="setTheme('cyber')">КИБЕР</div>
        <div class="theme-btn" onclick="setTheme('winter')">ЛЕД</div>
        <div class="theme-btn" onclick="setTheme('gothic')">ТЬМА</div>
        <div class="theme-btn" onclick="setTheme('retro')">НЕОН</div>
    </div>

    <div class="footer">
        <label class="file-lbl" for="fileInput">ФАЙЛ</label>
        <div class="close-btn" onclick="closeWebApp()">ЗАКРЫТЬ</div>
    </div>
    <input type="file" id="fileInput" accept="video/*,audio/*" style="display:none">
</div>

<audio id="local-audio"></audio>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let player, isYT = false, isVideoFile = false, currentRotation = 0;
    const a = document.getElementById('local-audio');
    const v = document.getElementById('local-video');
    const proxies = ["https://inv.vern.cc", "https://invidious.flokinet.to", "https://yewtu.be", "https://inv.n8ms.com"];
    let pIdx = 0;

    function closeWebApp() { tg.close(); }

    function setTheme(t) { 
        document.body.className = 'theme-' + t; 
        tg.HapticFeedback.selectionChanged();
    }

    // Сброс всех плееров и очистка памяти
    function resetAll() {
        if (isYT && player && player.stopVideo) player.stopVideo();
        if (v.src) { URL.revokeObjectURL(v.src); v.src = ""; }
        if (a.src) { URL.revokeObjectURL(a.src); a.src = ""; }
        
        a.pause(); v.pause();
        isYT = false; isVideoFile = false; currentRotation = 0;
        
        v.style.display = 'none';
        v.style.transform = 'rotate(0deg) scale(1)';
        document.getElementById('yt-wrapper').style.display = 'none';
        document.getElementById('yt-wrapper').style.transform = 'rotate(0deg) scale(1)';
        document.getElementById('cover-art').style.display = 'block';
    }

    // YouTube API
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-placeholder', {
            height: '100%', width: '100%',
            playerVars: { 'controls': 0, 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
            events: { 'onStateChange': () => updatePlayIcon() }
        });
    }

    // Поворот вправо
    function rotateVideo() {
        currentRotation = (currentRotation + 90) % 360;
        const target = isYT ? document.getElementById('yt-wrapper') : (isVideoFile ? v : null);
        if(target) {
            let scale = (currentRotation === 90 || currentRotation === 270) ? 0.6 : 1;
            target.style.transform = `rotate(${currentRotation}deg) scale(${scale})`;
        }
        tg.HapticFeedback.impactOccurred('light');
    }

    // Поиск
    async function runSearch() {
        const q = document.getElementById('searchInput').value;
        if(!q) return;
        const box = document.getElementById('resultsBox');
        box.innerHTML = '<div style="padding:15px; color:var(--neon)">ПОИСК...</div>';
        box.classList.add('active');

        const tryFetch = async () => {
            try {
                const r = await fetch(`${proxies[pIdx]}/api/v1/search?q=${encodeURIComponent(q)}&type=video`);
                const d = await r.json();
                renderResults(d);
            } catch (e) {
                pIdx = (pIdx + 1) % proxies.length;
                if (pIdx !== 0) tryFetch();
                else box.innerHTML = '<div style="padding:15px">ОШИБКА СЕТИ</div>';
            }
        };
        tryFetch();
    }

    function renderResults(data) {
        const box = document.getElementById('resultsBox');
        box.innerHTML = '';
        data.slice(0, 10).forEach(i => {
            const div = document.createElement('div');
            div.className = 'res-card';
            div.innerHTML = `
                <img src="${i.videoThumbnails[0].url}" width="60" style="border-radius:5px"> 
                <div style="overflow:hidden">
                    <div style="white-space:nowrap; text-overflow:ellipsis; overflow:hidden">${i.title}</div>
                    <div style="font-size:0.6rem; opacity:0.6">${i.author}</div>
                </div>`;
            div.onclick = () => {
                resetAll(); isYT = true; box.classList.remove('active');
                document.getElementById('cover-art').style.display = 'none';
                document.getElementById('yt-wrapper').style.display = 'block';
                document.getElementById('trackTitle').innerText = i.title;
                player.loadVideoById(i.videoId);
                tg.HapticFeedback.impactOccurred('medium');
            };
            box.appendChild(div);
        });
    }

    // Управление
    function togglePlay() {
        if(isYT) {
            if(player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo();
        } else if(isVideoFile) {
            v.paused ? v.play() : v.pause();
        } else {
            a.paused ? a.play() : a.pause();
        }
        updatePlayIcon();
        tg.HapticFeedback.impactOccurred('light');
    }

    function updatePlayIcon() {
        const icon = document.getElementById('playIcon');
        let playing = isYT ? (player.getPlayerState && player.getPlayerState() === 1) : (isVideoFile ? !v.paused : !a.paused);
        icon.innerHTML = playing ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    }

    function seekTrack(dir) {
        let d = dir * 10;
        if(isYT) player.seekTo(player.getCurrentTime() + d);
        else if(isVideoFile) v.currentTime += d;
        else a.currentTime += d;
        tg.HapticFeedback.selectionChanged();
    }

    // Прогресс
    setInterval(() => {
        let cur = 0, dur = 0;
        if(isYT) { try { cur = player.getCurrentTime(); dur = player.getDuration(); } catch(e){} }
        else if(isVideoFile) { cur = v.currentTime; dur = v.duration; }
        else { cur = a.currentTime; dur = a.duration; }
        if(dur) {
            const bar = document.getElementById('progressBar');
            bar.max = dur; bar.value = cur;
            document.getElementById('curTime').innerText = formatTime(cur);
            document.getElementById('durTime').innerText = formatTime(dur);
        }
    }, 500);

    function formatTime(s) {
        let m = Math.floor(s/60), sc = Math.floor(s%60);
        return `${m}:${sc < 10 ? '0'+sc : sc}`;
    }

    // Файлы
    document.getElementById('fileInput').onchange = function(e) {
        const file = e.target.files[0];
        if(!file) return;
        resetAll();
        const url = URL.createObjectURL(file);
        document.getElementById('trackTitle').innerText = file.name;
        if(file.type.startsWith('video')) {
            isVideoFile = true;
            document.getElementById('cover-art').style.display = 'none';
            v.style.display = 'block'; v.src = url; v.play();
        } else {
            a.src = url; a.play();
        }
        updatePlayIcon();
    };

    // Matrix Фон
    const canvas = document.getElementById('matrix-bg'), ctx = canvas.getContext('2d');
    let drops = [];
    function initM() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        drops = Array(Math.floor(canvas.width / 20)).fill(1);
    }
    function drawM() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.1)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--neon');
        ctx.font = "14px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), i * 20, y * 20);
            if (y * 20 > canvas.height && Math.random() > 0.98) drops[i] = 0;
            drops[i]++;
        });
    }
    window.onresize = initM; initM(); setInterval(drawM, 50);
</script>
</body>
</html>
