<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея Pro - Времена года</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* === Динамические переменные === */
        :root {
            --bg-primary: #f0f4f8;
            --bg-secondary: rgba(255, 255, 255, 0.7); /* Полупрозрачность для эффекта глубины */
            --bg-card: rgba(227, 242, 253, 0.8);
            --text-primary: #03a9f4;
            --text-secondary: #546e7a;
            --accent: #29b6f6;
            --border: #bbdefb;
            --gradient: linear-gradient(135deg, #4fc3f7 0%, #03a9f4 100%);
            --text-on-accent: #ffffff;
            --particle-color: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg-primary);
            color: #333;
            min-height: 100vh;
            padding-bottom: 70px;
            transition: background 0.5s ease;
            position: relative;
        }

        /* === НОВАЯ СИСТЕМА СЛОЕВ ЧАСТИЦ (ЗА ФОНОМ) === */
        #particleOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0; /* Самый низкий слой */
            overflow: hidden;
        }

        .page {
            position: relative;
            z-index: 10; /* Контент выше частиц */
            display: none;
            padding: 20px;
        }

        .page.active { display: block; }

        /* Эффект матового стекла для карточек, чтобы видеть частицы сзади */
        .stat-card, .post-card, .settings-section, .storage-bar {
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 15px;
        }

        /* === Профиль === */
        .profile-header {
            background: var(--gradient);
            padding: 40px 20px 30px;
            border-radius: 0 0 30px 30px;
            text-align: center;
            color: var(--text-on-accent);
            margin: -20px -20px 20px -20px;
            position: relative;
            z-index: 20;
        }

        .profile-avatar {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 48px;
            margin: 0 auto 15px;
            border: 4px solid var(--text-on-accent);
            color: white;
        }

        /* === Навигация === */
        .navbar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--bg-secondary);
            backdrop-filter: blur(15px);
            display: flex; justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
            border-top: 1px solid var(--border);
        }

        .nav-item { text-align: center; cursor: pointer; opacity: 0.6; transition: 0.3s; }
        .nav-item.active { opacity: 1; color: var(--text-primary); }
        .nav-icon { font-size: 24px; }
        .nav-label { font-size: 10px; }

        /* === Кнопки и формы === */
        .theme-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .theme-btn {
            padding: 12px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--bg-card); cursor: pointer; transition: 0.3s;
        }
        .theme-btn.active { background: var(--gradient); color: white; }

        .particle {
            position: absolute;
            top: -20px;
            will-change: transform;
        }

        /* Плеер */
        .music-control-panel {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .play-pause-btn {
            background: var(--gradient);
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
        }

        /* Анимации */
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
    
    <div id="particleOverlay"></div>

    <div class="page active" id="profilePage">
        <div class="profile-header">
            <div class="profile-avatar" id="profileAvatar">👤</div>
            <h2 id="profileName">Загрузка...</h2>
            <p id="profileUsername">@user</p>
            <div style="margin-top: 10px; font-weight: bold;" id="profileRank">☃️ Новичок</div>
        </div>

        <div class="profile-stats" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
            <div class="stat-card" style="padding: 15px; text-align: center;">
                <div id="postsCount" style="font-size: 20px; font-weight: bold; color: var(--text-primary);">0</div>
                <div style="font-size: 12px;">Постов</div>
            </div>
            <div class="stat-card" style="padding: 15px; text-align: center;">
                <div id="likesCount" style="font-size: 20px; font-weight: bold; color: var(--text-primary);">0</div>
                <div style="font-size: 12px;">Лайков</div>
            </div>
            <div class="stat-card" style="padding: 15px; text-align: center;">
                <div id="favoritesCount" style="font-size: 20px; font-weight: bold; color: var(--text-primary);">0</div>
                <div style="font-size: 12px;">Избранное</div>
            </div>
        </div>
    </div>

    <div class="page" id="settingsPage">
        <div class="settings-section" style="padding: 15px; margin-bottom: 20px;">
            <h3 style="margin-bottom: 10px; color: var(--text-primary);">🎵 Музыкальный плеер</h3>
            <div class="music-control-panel">
                <span id="trackName" style="font-size: 14px;">Relaxing Season Mix</span>
                <button class="play-pause-btn" onclick="toggleMusic()" id="musicBtn">▶</button>
            </div>
            <input type="text" id="musicUrl" placeholder="Вставьте ссылку на MP3" 
                   style="width: 100%; margin-top: 10px; padding: 8px; border-radius: 5px; border: 1px solid var(--border);">
        </div>

        <div class="settings-section" style="padding: 15px;">
            <h3 style="margin-bottom: 15px; color: var(--text-primary);">🎨 Смена сезона</h3>
            <div class="theme-options">
                <button class="theme-btn active" onclick="setTheme('winter')">❄️ Зима</button>
                <button class="theme-btn" onclick="setTheme('spring')">🌸 Весна</button>
                <button class="theme-btn" onclick="setTheme('summer')">☀️ Лето</button>
                <button class="theme-btn" onclick="setTheme('autumn')">🍂 Осень</button>
            </div>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-item active" onclick="showPage('profile')">
            <div class="nav-icon">👤</div>
            <div class="nav-label">Профиль</div>
        </div>
        <div class="nav-item" onclick="showPage('settings')">
            <div class="nav-icon">⚙️</div>
            <div class="nav-label">Настройки</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        let currentSeason = 'winter';
        const particleOverlay = document.getElementById('particleOverlay');
        const audio = document.getElementById('bgMusic');

        const seasons = {
            winter: { 
                chars: ['❄', '❅', '❆'], 
                color: '#ffffff', 
                bg: '#f0f4f8', 
                grad: 'linear-gradient(135deg, #4fc3f7 0%, #03a9f4 100%)',
                primary: '#03a9f4'
            },
            spring: { 
                chars: ['🌸', '🌷', '🌱'], 
                color: '#ffc0cb', 
                bg: '#f1f8e9', 
                grad: 'linear-gradient(135deg, #aed581 0%, #689f38 100%)',
                primary: '#4caf50'
            },
            summer: { 
                chars: ['☀️', '🌻', '🦋'], 
                color: '#ffeb3b', 
                bg: '#fffde7', 
                grad: 'linear-gradient(135deg, #ffc107 0%, #fbc02d 100%)',
                primary: '#fbc02d'
            },
            autumn: { 
                chars: ['🍂', '🍁', '🍄'], 
                color: '#ff9800', 
                bg: '#fff3e0', 
                grad: 'linear-gradient(135deg, #ff6b00 0%, #e64a19 100%)',
                primary: '#e64a19'
            }
        };

        // Логика частиц
        function createParticle() {
            const config = seasons[currentSeason];
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = config.chars[Math.floor(Math.random() * config.chars.length)];
            
            const startX = Math.random() * window.innerWidth;
            const size = Math.random() * 20 + 10;
            const duration = Math.random() * 5 + 5;

            p.style.left = startX + 'px';
            p.style.fontSize = size + 'px';
            p.style.color = config.color;
            p.style.opacity = Math.random() * 0.7 + 0.3;
            p.style.animation = `fall ${duration}s linear infinite`;
            
            particleOverlay.appendChild(p);
            setTimeout(() => p.remove(), duration * 1000);
        }

        setInterval(createParticle, 300);

        // Переключение тем
        function setTheme(season) {
            currentSeason = season;
            const s = seasons[season];
            const root = document.documentElement;

            root.style.setProperty('--bg-primary', s.bg);
            root.style.setProperty('--gradient', s.grad);
            root.style.setProperty('--text-primary', s.primary);
            
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase().includes(season === 'winter' ? 'зима' : season === 'spring' ? 'весна' : season === 'summer' ? 'лето' : 'осень'));
            });

            particleOverlay.innerHTML = ''; // Очистить старые частицы
        }

        // Переключение страниц
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(pageId + 'Page').classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Плеер
        function toggleMusic() {
            const btn = document.getElementById('musicBtn');
            const urlInput = document.getElementById('musicUrl').value;

            if (urlInput && audio.src !== urlInput) {
                audio.src = urlInput;
            }

            if (audio.paused) {
                audio.play();
                btn.innerText = '⏸';
                tg.showPopup({ message: "Музыка играет" });
            } else {
                audio.pause();
                btn.innerText = '▶';
            }
        }

        // Инициализация данных пользователя
        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('profileName').innerText = user.first_name;
            document.getElementById('profileUsername').innerText = user.username ? '@' + user.username : '';
            document.getElementById('profileAvatar').innerText = user.first_name.charAt(0);
        }
    </script>
</body>
</html>
