<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CYBER PLAYER ULTIMATE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff; --bg: #05080a; --panel: rgba(10, 16, 20, 0.95);
            --border: rgba(0, 242, 255, 0.4); --text: #cffafe;
        }
        body.theme-cyber { --neon: #00f2ff; --bg: #05080a; --border: #00f2ff66; --text: #cffafe; }
        body.theme-winter { --neon: #a0e9ff; --bg: #0a141a; --border: #a0e9ff33; --text: #f0faff; }
        body.theme-gothic { --neon: #ff0000; --bg: #0a0000; --border: #330000; --text: #ffcccc; }
        body.theme-steampunk { --neon: #ffaa00; --bg: #1a0f00; --border: #553300; --text: #ffe0b3; }
        body.theme-biopunk { --neon: #39ff14; --bg: #040d04; --border: #1a4d00; --text: #d0ffd0; }
        body.theme-retro { --neon: #ff00ff; --bg: #120024; --border: #ff00ff66; --text: #ffccff; }
        body.theme-industrial { --neon: #999999; --bg: #111111; --border: #444444; --text: #eeeeee; }

        * { box-sizing: border-box; outline: none; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Rajdhani', sans-serif; height: 100vh;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            transition: 0.5s;
        }

        #matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.5; pointer-events: none; }

        .main-deck {
            position: relative; z-index: 10; width: 92vw; max-width: 440px;
            background: var(--panel); border: 2px solid var(--border);
            border-radius: 15px; padding: 20px; backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        /* Fullscreen */
        #playerNode:fullscreen { width: 100vw; height: 100vh; border-radius: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .twa-fs { width: 100vw !important; height: 100vh !important; max-width: none !important; border-radius: 0 !important; }

        .search-bar { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; border: 1px solid var(--border); }
        .search-bar input { flex: 1; background: transparent; border: none; color: var(--neon); font-family: 'Orbitron'; padding: 8px; font-size: 0.8rem; }
        .search-bar button { background: var(--neon); border: none; color: #000; padding: 0 10px; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; }

        .display-container {
            width: 100%; height: 210px; background: #000; border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
        }
        #playerNode:fullscreen .display-container, .twa-fs .display-container { height: 55vh; }

        #yt-wrapper, #local-video { width: 100%; height: 100%; display: none; object-fit: contain; }
        #cover-art { width: 100%; height: 100%; object-fit: cover; }

        .track-info { text-align: center; margin: 10px 0; font-family: 'Orbitron'; font-size: 0.75rem; color: var(--neon); height: 18px; overflow: hidden; }

        .progress-block { width: 100%; margin: 10px 0; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--neon); }
        .time-info { display: flex; justify-content: space-between; font-size: 0.6rem; font-family: 'Orbitron'; color: var(--neon); }

        .btn-row { display: flex; justify-content: space-between; align-items: center; }
        .btn { background: none; border: none; color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .btn svg { width: 28px; height: 28px; fill: currentColor; }
        .btn-val { font-size: 0.5rem; margin-top: 2px; font-family: 'Orbitron'; }
        
        .play-main { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--border); color: var(--neon); display: flex; justify-content: center; align-items: center; }

        .theme-selector { margin-top: 15px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .theme-btn { font-size: 0.5rem; padding: 6px 2px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: var(--text); cursor: pointer; text-align: center; }

        .footer { display: flex; justify-content: center; gap: 15px; margin-top: 15px; font-size: 0.65rem; font-family: 'Orbitron'; }
        .footer label, .footer span { cursor: pointer; color: var(--neon); }

        .results-dropdown {
            position: absolute; top: 65px; left: 20px; right: 20px; background: #000;
            border: 1px solid var(--neon); max-height: 160px; overflow-y: auto;
            display: none; z-index: 100;
        }
        .results-dropdown.active { display: block; }
        .res-card { display: flex; gap: 10px; padding: 8px; border-bottom: 1px solid #222; cursor: pointer; align-items: center; font-size: 0.7rem; }
    </style>
</head>
<body class="theme-cyber">

<canvas id="matrix-bg"></canvas>

<div class="main-deck" id="playerNode">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="НАЙТИ ТРЕК...">
        <button onclick="runSearch()">ПОИСК</button>
    </div>
    <div class="results-dropdown" id="resultsBox"></div>

    <div class="display-container">
        <div id="yt-wrapper" style="width:100%;height:100%"><div id="yt-placeholder"></div></div>
        <video id="local-video"></video>
        <img id="cover-art" src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500">
    </div>

    <div id="trackTitle" class="track-info">ОЖИДАНИЕ...</div>

    <div class="progress-block">
        <input type="range" id="progressBar" value="0" step="1" oninput="manualSeek(this.value)">
        <div class="time-info">
            <span id="curTime">0:00</span>
            <span id="durTime">0:00</span>
        </div>
    </div>

    <div class="btn-row">
        <button class="btn" onclick="seekTrack(-1)">
            <svg viewBox="0 0 24 24" style="transform: scaleX(-1);"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            <span class="btn-val">-10с</span>
        </button>

        <button class="btn" onclick="rotateVideo()">
            <svg viewBox="0 0 24 24"><path d="M12 4V1l5 5-5 5V8c-3.31 0-6 2.69-6 6 0 1.01.25 1.97.7 2.8l-1.46 1.46C4.46 16.97 4 15.51 4 14c0-4.42 3.58-8 8-8z"/></svg>
            <span class="btn-val">ПОВОРОТ</span>
        </button>

        <button class="btn play-main" onclick="togglePlay()">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="btn" onclick="toggleFull()">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            <span class="btn-val">ЭКРАН</span>
        </button>

        <button class="btn" onclick="seekTrack(1)">
            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            <span class="btn-val">+10с</span>
        </button>
    </div>

    <div class="theme-selector">
        <div class="theme-btn" onclick="setTheme('cyber')">КИБЕР</div>
        <div class="theme-btn" onclick="setTheme('winter')">ЗИМА</div>
        <div class="theme-btn" onclick="setTheme('gothic')">ГОТИКА</div>
        <div class="theme-btn" onclick="setTheme('steampunk')">ПАРОВОЗ</div>
        <div class="theme-btn" onclick="setTheme('biopunk')">БИОПАНК</div>
        <div class="theme-btn" onclick="setTheme('retro')">РЕТРО</div>
        <div class="theme-btn" onclick="setTheme('industrial')">ЗАВОД</div>
    </div>

    <div class="footer">
        <label for="fileInput">[ ФАЙЛ ]</label>
        <span onclick="location.reload()">[ СБРОС ]</span>
    </div>
    <input type="file" id="fileInput" accept="video/*,audio/*" style="display:none">
</div>

<audio id="local-audio"></audio>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    let player, isYT = false, isVideoFile = false, skipSec = 10, currentRotation = 0;
    const a = document.getElementById('local-audio'), v = document.getElementById('local-video');
    const themeAssets = {
        cyber: ["⚡", "💾"], winter: ["❄", "❅"], gothic: ["💀", "🦇"],
        steampunk: ["⚙", "🕰"], biopunk: ["🧬", "🌿"], retro: ["👾", "🕹"], industrial: ["☢", "🛠"]
    };

    function toggleFull() {
        const node = document.getElementById('playerNode');
        if (!tg.isExpanded) tg.expand();
        node.classList.toggle('twa-fs');
        try {
            if (!document.fullscreenElement) {
                if (node.requestFullscreen) node.requestFullscreen();
                else if (node.webkitRequestFullscreen) node.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        } catch(e) {}
    }

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-placeholder', {
            height: '100%', width: '100%',
            playerVars: { 'controls': 0, 'rel': 0, 'modestbranding': 1 },
            events: { 'onStateChange': () => updatePlayIcon() }
        });
    }

    async function runSearch() {
        const q = document.getElementById('searchInput').value;
        if(!q) return;
        const box = document.getElementById('resultsBox');
        box.innerHTML = '<div style="padding:15px">ПОДКЛЮЧЕНИЕ К СЕТИ...</div>';
        box.classList.add('active');
        
        try {
            // Используем проверенный прокси Invidious
            const res = await fetch(`https://vid.puffyan.us/api/v1/search?q=${encodeURIComponent(q)}&type=video`);
            const data = await res.json();
            box.innerHTML = '';
            if(!data.length) { box.innerHTML = '<div style="padding:15px">НИЧЕГО НЕ НАЙДЕНО</div>'; return; }
            
            data.slice(0, 10).forEach(i => {
                const div = document.createElement('div');
                div.className = 'res-card';
                div.innerHTML = `<img src="${i.videoThumbnails[0].url}" width="40"> <span>${i.title}</span>`;
                div.onclick = () => {
                    resetMedia(); isYT = true; box.classList.remove('active');
                    document.getElementById('cover-art').style.display = 'none';
                    document.getElementById('yt-wrapper').style.display = 'block';
                    document.getElementById('trackTitle').innerText = i.title;
                    player.loadVideoById(i.videoId);
                };
                box.appendChild(div);
            });
        } catch (e) { 
            box.innerHTML = '<div style="padding:15px">ОШИБКА ПОИСКА. ПОПРОБУЙТЕ СНОВА.</div>'; 
        }
    }

    function resetMedia() {
        isYT = false; isVideoFile = false; currentRotation = 0;
        try { player.stopVideo(); } catch(e){}
        a.pause(); v.pause();
        v.style.display = 'none';
        document.getElementById('yt-wrapper').style.display = 'none';
        document.getElementById('cover-art').style.display = 'block';
    }

    function togglePlay() {
        if(isYT) {
            if(player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo();
        }
        else if(isVideoFile) v.paused ? v.play() : v.pause();
        else a.paused ? a.play() : a.pause();
        updatePlayIcon();
    }

    function updatePlayIcon() {
        const icon = document.getElementById('playIcon');
        let playing = isYT ? (player.getPlayerState && player.getPlayerState() === 1) : (isVideoFile ? !v.paused : !a.paused);
        icon.innerHTML = playing ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    }

    function seekTrack(dir) {
        let d = dir * skipSec;
        if(isYT) player.seekTo(player.getCurrentTime() + d);
        else if(isVideoFile) v.currentTime += d;
        else a.currentTime += d;
    }

    function manualSeek(val) {
        if(isYT) player.seekTo(val);
        else if(isVideoFile) v.currentTime = val;
        else a.currentTime = val;
    }

    function rotateVideo() {
        currentRotation = (currentRotation + 90) % 360; 
        const target = isYT ? document.getElementById('yt-wrapper') : v;
        let scale = (currentRotation === 90 || currentRotation === 270) ? 0.6 : 1;
        target.style.transform = `rotate(${currentRotation}deg) scale(${scale})`;
    }

    setInterval(() => {
        let cur = 0, dur = 0;
        if(isYT) { try { cur = player.getCurrentTime(); dur = player.getDuration(); } catch(e){} }
        else if(isVideoFile) { cur = v.currentTime; dur = v.duration; }
        else { cur = a.currentTime; dur = a.duration; }
        if(dur) {
            const bar = document.getElementById('progressBar');
            bar.max = Math.floor(dur); bar.value = Math.floor(cur);
            document.getElementById('curTime').innerText = formatTime(cur);
            document.getElementById('durTime').innerText = formatTime(dur);
        }
    }, 500);

    function formatTime(s) {
        let m = Math.floor(s/60), sc = Math.floor(s%60);
        return `${m}:${sc < 10 ? '0'+sc : sc}`;
    }

    document.getElementById('fileInput').onchange = function(e) {
        const file = e.target.files[0];
        if(!file) return;
        resetMedia();
        const url = URL.createObjectURL(file);
        document.getElementById('trackTitle').innerText = file.name;
        if(file.type.startsWith('video')) {
            isVideoFile = true;
            document.getElementById('cover-art').style.display = 'none';
            v.style.display = 'block'; v.src = url; v.play();
        } else { a.src = url; a.play(); }
        updatePlayIcon();
    };

    function setTheme(t) { document.body.className = 'theme-' + t; }

    const canvas = document.getElementById('matrix-bg'), ctx = canvas.getContext('2d');
    let drops = [];
    function initM() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        drops = Array(Math.floor(canvas.width / 25)).fill(1);
    }
    function drawM() {
        const theme = document.body.className.replace('theme-', '');
        const assets = themeAssets[theme] || themeAssets.cyber;
        ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--neon');
        ctx.font = "16px monospace";
        
        drops.forEach((y, i) => {
            // Вероятность появления эмодзи 2% вместо символа матрицы
            const isEmoji = Math.random() > 0.98;
            const char = isEmoji ? assets[Math.floor(Math.random() * assets.length)] : (Math.random() > 0.5 ? "1" : "0");
            
            ctx.fillText(char, i * 25, y * 25);
            if (y * 25 > canvas.height && Math.random() > 0.98) drops[i] = 0;
            drops[i]++;
        });
    }
    window.onresize = initM; initM(); setInterval(drawM, 80);
    window.onclick = (e) => { if(!e.target.closest('.search-bar')) document.getElementById('resultsBox').classList.remove('active'); }
</script>
</body>
</html>
