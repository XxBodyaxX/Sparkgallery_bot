<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER PLAYER ULTRA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff; --bg: #05080a; --panel: rgba(10, 16, 20, 0.95);
            --border: rgba(0, 242, 255, 0.4); --text: #cffafe;
        }
        body.theme-cyber { --neon: #00f2ff; --bg: #05080a; --border: #00f2ff66; }
        body.theme-winter { --neon: #a0e9ff; --bg: #0a141a; --border: #a0e9ff33; }
        body.theme-gothic { --neon: #ff0000; --bg: #0a0000; --border: #330000; }
        body.theme-steampunk { --neon: #ffaa00; --bg: #1a0f00; --border: #553300; }
        body.theme-biopunk { --neon: #39ff14; --bg: #040d04; --border: #1a4d00; }
        body.theme-retro { --neon: #ff00ff; --bg: #120024; --border: #ff00ff66; }
        body.theme-industrial { --neon: #999999; --bg: #111111; --border: #444444; }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Rajdhani', sans-serif; height: 100vh;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            transition: 0.5s;
        }

        #matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.3; pointer-events: none; }

        .main-deck {
            position: relative; z-index: 10; width: 92vw; max-width: 440px;
            background: var(--panel); border: 2px solid var(--border);
            border-radius: 15px; padding: 20px; backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
        }

        .main-deck.fullscreen-active { max-width: none; width: 100vw; height: 100vh; border: none; border-radius: 0; }

        .search-bar { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; border: 1px solid var(--border); }
        .search-bar input { flex: 1; background: transparent; border: none; color: var(--neon); font-family: 'Orbitron'; padding: 8px; font-size: 0.8rem; }
        .search-bar button { background: var(--neon); border: none; color: #000; padding: 0 15px; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; border-radius: 3px; }

        .display-container {
            width: 100%; height: 210px; background: #000; border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
        }
        .fullscreen-active .display-container { height: 60vh; }

        #yt-wrapper { width: 100%; height: 100%; display: none; position: relative; z-index: 3; }
        #local-video { width: 100%; height: 100%; display: none; object-fit: contain; position: relative; z-index: 3; }
        #cover-art { width: 100%; height: 100%; object-fit: cover; cursor: pointer; position: absolute; top: 0; left: 0; z-index: 5; }

        /* ИСПРАВЛЕННЫЙ БЛОК НАЗВАНИЯ (Бегущая строка) */
        .track-info-wrap { 
            width: 100%; overflow: hidden; margin: 10px 0; height: 20px; position: relative;
        }
        .track-info { 
            position: absolute; white-space: nowrap; font-family: 'Orbitron'; 
            font-size: 0.75rem; color: var(--neon); left: 0; transition: 0s;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .marquee-active { animation: marquee 10s linear infinite; }

        .config-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
        .config-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; font-family: 'Orbitron'; font-size: 0.6rem; color: var(--neon); }
        .config-item input, .config-item select { background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: var(--neon); width: 100%; text-align: center; font-family: 'Orbitron'; border-radius: 3px; padding: 4px; font-size: 0.7rem; }

        .progress-block { width: 100%; margin: 5px 0 15px 0; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--neon); }
        .time-info { display: flex; justify-content: space-between; font-size: 0.6rem; font-family: 'Orbitron'; color: var(--neon); }

        .btn-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { background: none; border: none; color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .btn svg { width: 30px; height: 30px; fill: currentColor; }
        .btn-val { font-size: 0.55rem; margin-top: 4px; font-family: 'Orbitron'; color: var(--neon); }
        
        .play-main { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--border); color: var(--neon); display: flex; justify-content: center; align-items: center; }

        .theme-container { margin-top: auto; padding-top: 15px; border-top: 1px dashed var(--border); text-align: center; }
        .theme-selector { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .theme-btn { font-size: 0.55rem; padding: 6px 10px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: var(--text); cursor: pointer; border-radius: 4px; min-width: 90px; }

        .footer { display: flex; justify-content: center; gap: 20px; margin-top: 15px; font-size: 0.7rem; font-family: 'Orbitron'; color: var(--neon); }
        
        .results-dropdown {
            position: absolute; top: 60px; left: 20px; right: 20px; background: rgba(5,8,10,0.98);
            border: 1px solid var(--neon); max-height: 240px; overflow-y: auto;
            display: none; z-index: 100;
        }
        .results-dropdown.active { display: block; }
        .res-card { display: flex; gap: 10px; padding: 8px; border-bottom: 1px solid rgba(0,242,255,0.1); cursor: pointer; align-items: center; font-size: 0.7rem; }
    </style>
</head>
<body class="theme-cyber">

<canvas id="matrix-bg"></canvas>

<div class="main-deck" id="playerNode">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="НАЗВАНИЕ ВИДЕО...">
        <button onclick="runSearch()">ПОИСК</button>
    </div>
    
    <div class="results-dropdown" id="resultsBox"></div>

    <div class="display-container">
        <div id="yt-wrapper"><div id="yt-placeholder"></div></div>
        <video id="local-video" playsinline></video>
        <img id="cover-art" src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500" onclick="togglePlay()">
    </div>

    <div class="track-info-wrap">
        <div id="trackTitle" class="track-info">СИСТЕМА ГОТОВА</div>
    </div>

    <div class="config-row">
        <div class="config-item">
            <span>ПЕРЕМОТКА (макс. 60 сек):</span>
            <input type="number" id="skipInp" value="10" oninput="updateSkipStep(this)">
        </div>
        <div class="config-item">
            <span>СКОРОСТЬ:</span>
            <select id="speedSel" onchange="setSpeed(this.value)">
                <option value="0.25">0.25x</option>
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1" selected>1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2.0x</option>
            </select>
        </div>
    </div>

    <div class="progress-block">
        <input type="range" id="progressBar" value="0" step="1" oninput="manualSeek(this.value)">
        <div class="time-info">
            <span id="curTime">0:00</span>
            <span id="durTime">0:00</span>
        </div>
    </div>

    <div class="btn-row">
        <button class="btn" onclick="seekTrack(-1)">
            <svg viewBox="0 0 24 24" style="transform: scaleX(-1);"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            <span class="btn-val" id="skipLblBack">-10с</span>
        </button>

        <button class="btn" onclick="rotateVideo()">
            <svg viewBox="0 0 24 24"><path d="M12 4V1l5 5-5 5V8c-3.31 0-6 2.69-6 6 0 1.01.25 1.97.7 2.8l-1.46 1.46C4.46 16.97 4 15.51 4 14c0-4.42 3.58-8 8-8z"/></svg>
            <span class="btn-val">ПОВОРОТ</span>
        </button>

        <button class="btn play-main" onclick="togglePlay()">
            <svg id="playIcon" viewBox="0 0 24 24" width="35" height="35"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="btn" onclick="toggleFS()">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            <span class="btn-val">ЭКРАН</span>
        </button>

        <button class="btn" onclick="seekTrack(1)">
            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            <span class="btn-val" id="skipLblFwd">+10с</span>
        </button>
    </div>

    <div class="theme-container">
        <div class="theme-selector">
            <div class="theme-btn" onclick="setTheme('cyber')">КИБЕРПАНК</div>
            <div class="theme-btn" onclick="setTheme('winter')">ЗИМНИЙ</div>
            <div class="theme-btn" onclick="setTheme('gothic')">ГОТИКА</div>
            <div class="theme-btn" onclick="setTheme('steampunk')">СТИМПАНК</div>
            <div class="theme-btn" onclick="setTheme('biopunk')">БИОПАНК</div>
            <div class="theme-btn" onclick="setTheme('retro')">РЕТРО</div>
            <div class="theme-btn" onclick="setTheme('industrial')">ПРОМЗОНА</div>
        </div>
    </div>

    <div class="footer">
        <label for="fileInput" style="cursor:pointer">[ ФАЙЛ ]</label>
        <span onclick="location.reload()" style="cursor:pointer">[ СБРОС ]</span>
    </div>
    <input type="file" id="fileInput" accept="video/*,audio/*" style="display:none">
</div>

<audio id="local-audio" style="display:none"></audio>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    let player, isYT = false, isFile = false, skipStep = 10, rotation = 0, currentSpeed = 1, isFull = false;
    const audio = document.getElementById('local-audio'), video = document.getElementById('local-video'), cover = document.getElementById('cover-art');
    
    const proxies = ["https://invidious.v0l.me", "https://invidious.dhusch.de", "https://inv.vern.cc", "https://inv.tux.pizza"];
    let currentProxyIdx = 0;

    // ОБНОВЛЕНИЕ ЗАГОЛОВКА С ПРОВЕРКОЙ НА ДЛИНУ
    function setTitle(txt) {
        const el = document.getElementById('trackTitle');
        el.innerText = txt;
        el.classList.remove('marquee-active');
        el.style.left = '0';
        
        // Даем браузеру время отрисовать текст, чтобы замерить ширину
        setTimeout(() => {
            if (el.scrollWidth > el.parentElement.offsetWidth) {
                el.classList.add('marquee-active');
            }
        }, 100);
    }

    function updateSkipStep(input) {
        let val = parseInt(input.value);
        if (isNaN(val) || val < 1) val = 1; 
        if (val > 60) { val = 60; input.value = 60; }
        skipStep = val;
        document.getElementById('skipLblBack').innerText = `-${val}с`;
        document.getElementById('skipLblFwd').innerText = `+${val}с`;
    }

    // ИСПРАВЛЕННАЯ ФУНКЦИЯ СКОРОСТИ (теперь с повторами для YT)
    function applySpeed() {
        if(isYT && player && typeof player.setPlaybackRate === 'function') {
            player.setPlaybackRate(currentSpeed);
            // Повторяем несколько раз, так как YT сбрасывает скорость при старте
            let attempts = 0;
            const interval = setInterval(() => {
                if(player && player.setPlaybackRate) player.setPlaybackRate(currentSpeed);
                if(++attempts > 4) clearInterval(interval);
            }, 500);
        }
        if(isFile) video.playbackRate = currentSpeed;
        audio.playbackRate = currentSpeed;
    }

    function setSpeed(v) { 
        currentSpeed = parseFloat(v); 
        applySpeed(); 
    }

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-placeholder', {
            height: '100%', width: '100%',
            playerVars: { 'controls': 0, 'modestbranding': 1, 'rel': 0, 'playsinline': 1, 'origin': window.location.origin },
            events: { 
                'onStateChange': (e) => {
                    updatePlayIcon();
                    if(e.data === 1 || e.data === 3) {
                        applySpeed();
                        cover.style.display = 'none';
                        document.getElementById('yt-wrapper').style.display = 'block';
                    }
                }
            }
        });
    }

    async function runSearch(retry = 0) {
        const query = document.getElementById('searchInput').value;
        if(!query) return;
        const box = document.getElementById('resultsBox');
        if (retry === 0) {
            box.innerHTML = '<div style="padding:15px; color:var(--neon);">ПОИСК...</div>';
            box.classList.add('active');
        }
        try {
            const response = await fetch(`${proxies[currentProxyIdx]}/api/v1/search?q=${encodeURIComponent(query)}&type=video`);
            const data = await response.json();
            box.innerHTML = '';
            data.slice(0, 10).forEach(item => {
                const card = document.createElement('div');
                card.className = 'res-card';
                const thumb = `https://img.youtube.com/vi/${item.videoId}/mqdefault.jpg`;
                card.innerHTML = `<img src="${thumb}" width="50"> <div style="flex:1; overflow:hidden;">${item.title}</div>`;
                card.onclick = () => {
                    resetMedia(); 
                    isYT = true; 
                    box.classList.remove('active');
                    setTitle(item.title);
                    cover.style.display = 'none';
                    document.getElementById('yt-wrapper').style.display = 'block';
                    if(player && player.loadVideoById) {
                        player.loadVideoById(item.videoId);
                        setTimeout(applySpeed, 800);
                    }
                };
                box.appendChild(card);
            });
        } catch (e) { 
            if (retry < proxies.length) {
                currentProxyIdx = (currentProxyIdx + 1) % proxies.length;
                runSearch(retry + 1);
            } else { box.innerHTML = '<div style="padding:15px">Ошибка.</div>'; }
        }
    }

    function resetMedia() {
        isYT = isFile = false; rotation = 0;
        if(player && player.stopVideo) try { player.stopVideo(); } catch(e){}
        audio.pause(); video.pause();
        video.style.display = 'none'; 
        document.getElementById('yt-wrapper').style.display = 'none';
        cover.style.display = 'block';
    }

    function togglePlay() {
        if(isYT) {
            const state = player.getPlayerState();
            if (state === 1 || state === 3) player.pauseVideo();
            else { player.playVideo(); applySpeed(); }
        } else if(isFile) {
            video.paused ? video.play() : video.pause();
            applySpeed();
        } else {
            audio.paused ? audio.play() : audio.pause();
            applySpeed();
        }
        setTimeout(updatePlayIcon, 200);
    }

    function updatePlayIcon() {
        const icon = document.getElementById('playIcon');
        let playing = false;
        if(isYT && player && player.getPlayerState) {
            const s = player.getPlayerState();
            playing = (s === 1 || s === 3);
        } else if(isFile) playing = !video.paused;
        else playing = !audio.paused;
        icon.innerHTML = playing ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    }

    function seekTrack(dir) {
        const d = dir * skipStep;
        if(isYT) player.seekTo(player.getCurrentTime() + d);
        else if(isFile) video.currentTime += d;
        else audio.currentTime += d;
    }

    function manualSeek(v) {
        if(isYT) player.seekTo(v);
        else if(isFile) video.currentTime = v;
        else audio.currentTime = v;
    }

    function rotateVideo() {
        rotation = (rotation + 90) % 360; 
        const target = isYT ? document.getElementById('yt-wrapper') : video;
        target.style.transform = `rotate(${rotation}deg) scale(${ (rotation % 180 === 0) ? 1 : 0.6 })`;
    }

    function toggleFS() {
        const node = document.getElementById('playerNode');
        if (!isFull) { node.classList.add('fullscreen-active'); isFull = true; } 
        else { node.classList.remove('fullscreen-active'); isFull = false; }
    }

    setInterval(() => {
        let cur = 0, dur = 0;
        if(isYT && player && player.getCurrentTime) { cur = player.getCurrentTime(); dur = player.getDuration(); }
        else if(isFile) { cur = video.currentTime; dur = video.duration; }
        else { cur = audio.currentTime; dur = audio.duration; }
        if(dur) {
            const bar = document.getElementById('progressBar');
            bar.max = Math.floor(dur); bar.value = Math.floor(cur);
            document.getElementById('curTime').innerText = fmt(cur);
            document.getElementById('durTime').innerText = fmt(dur);
        }
    }, 1000);

    function fmt(s) {
        let m = Math.floor(s/60), sc = Math.floor(s%60);
        return `${m}:${sc < 10 ? '0'+sc : sc}`;
    }

    document.getElementById('fileInput').onchange = (e) => {
        const f = e.target.files[0]; if(!f) return;
        resetMedia(); const u = URL.createObjectURL(f);
        setTitle(f.name);
        if(f.type.startsWith('video')) {
            isFile = true; cover.style.display = 'none';
            video.style.display = 'block'; video.src = u; video.play();
        } else { audio.src = u; audio.play(); }
        setTimeout(applySpeed, 300);
        updatePlayIcon();
    };

    function setTheme(t) { document.body.className = 'theme-' + t; }

    const can = document.getElementById('matrix-bg'), ctx = can.getContext('2d');
    let dr = [];
    function rs() { can.width = window.innerWidth; can.height = window.innerHeight; dr = Array(Math.floor(can.width / 20)).fill(1); }
    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,can.width,can.height);
        ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--neon');
        ctx.font = "15px Orbitron";
        dr.forEach((y, i) => {
            ctx.fillText(Math.random()>0.5?"0":"1", i*20, y*20);
            if(y*20 > can.height && Math.random()>0.975) dr[i]=0; dr[i]++;
        });
    }
    window.onresize = rs; rs(); setInterval(draw, 50);
    window.onclick = (e) => { if(!e.target.closest('.search-bar')) document.getElementById('resultsBox').classList.remove('active'); }
</script>
</body>
</html>
